# Builds the Windows app (desktop/) on a Windows machine and publishes it as a GitHub Release.
# Run it from the Actions tab ("Run workflow", type a version like 1.0.0), or push a tag like v1.0.0.
name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (like 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release and upload the files

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # electron-builder downloads its own copy of Electron for Windows; skip the npm one.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Pick the version number
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Version must look like 1.2.3, got '$V'"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Install build tools
        working-directory: desktop
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build the .exe files
        working-directory: desktop
        run: npm run dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="desktop/dist/MechanicsSandbox-$VERSION-portable.exe desktop/dist/MechanicsSandbox-$VERSION-setup.exe mechanics-sandbox.html"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" $FILES --clobber
          else
            gh release create "v$VERSION" $FILES --title "Mechanics Sandbox $VERSION" --notes-file desktop/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
