<!--
  MECHANICS SANDBOX - Phase 2 (editor + core physics)
  ---------------------------------------------------
  One self-contained file. Sections in the <script> below:
    1. Utilities (vector math)
    2. Safe expression parser (no eval)
    3. Settings, view, scene model
    4. Object types: defaults, anchors, point fields
    5. LaTeX labels (MathJax SVG)
    6. SVG drawing primitives (hatching, arrows, springs, dampers...)
    7. Per-type renderers
    8. Rendering the whole scene + overlay
    9. Snapping
   10. Tools (creating objects)
   11. Mouse / keyboard interaction
   12. Properties panel
   13. Undo/redo, clipboard, delete
   14. Save / load / export
   15. Example scenes (the 4 reference diagrams)
   16. Physics: building a Planck world from the scene
   17. Physics: custom rope constraint (ropes over pulleys)
   18. Simulation controls (play / pause / step / reset, fixed time step)
   19. Built-in tests
   20. Startup
  Coordinates: the scene is stored in METERS with +y UP (textbook convention).
  Only the renderer converts to screen pixels (where SVG's +y is DOWN).
-->
<style>

  .row input.bad { border-color: #c00; background: #fee; }

  /* simulation controls */

  #testBox[hidden] { display: none; }

  .pass { color: #070; font-weight: 600; } .fail { color: #b00; font-weight: 600; }
</style>

<script>
'use strict';
/* =====================================================================
   1. UTILITIES
   Small 2D vector helpers. Points are plain objects {x, y}
   (like a Python dict or a namedtuple).
   ===================================================================== */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, s) => ({ x: a.x * s, y: a.y * s }),
  len: (a) => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  unit: (a) => { const L = Math.hypot(a.x, a.y) || 1; return { x: a.x / L, y: a.y / L }; },
  perp: (a) => ({ x: -a.y, y: a.x }),            // rotate +90 degrees
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,        // z-component of the 3D cross product
  dir: (ang) => ({ x: Math.cos(ang), y: Math.sin(ang) }),
};
const toDeg = (r) => r * 180 / Math.PI;
const toRad = (d) => d * Math.PI / 180;
const TAU = 2 * Math.PI;
const mod = (a, n) => ((a % n) + n) % n;
const f = (n) => Math.round(n * 100) / 100;      // trim numbers written into SVG
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);

/* =====================================================================
   2. SAFE EXPRESSION PARSER
   Turns text like "5 sin(2t)" into a function of variables, WITHOUT eval().
   Grammar (recursive descent, one function per rule):
     expr    := term (('+' | '-') term)*
     term    := unary (('*' | '/' | implicit) unary)*
     unary   := ('-' | '+') unary | power
     power   := primary ('^' unary)?
     primary := number | name | name '(' args ')' | '(' expr ')'
   compile() returns a JavaScript closure - think of it as building a tree of
   Python lambdas, then calling the root lambda with a dict of variables.
   ===================================================================== */
const Expr = (function () {
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, sqrt: Math.sqrt,
    abs: Math.abs, log: Math.log, sign: Math.sign, min: Math.min, max: Math.max,
    step: (x) => (x >= 0 ? 1 : 0),               // Heaviside step u(x)
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const toks = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(src.slice(i));
        if (!m) throw new Error('Bad number at ' + i);
        toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        const m = /^[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(i));
        toks.push({ t: 'name', v: m[0] }); i += m[0].length; continue;
      }
      if ('+-*/^(),'.includes(c)) { toks.push({ t: c }); i++; continue; }
      throw new Error('Unexpected "' + c + '"');
    }
    return toks;
  }

  function compile(src, allowedVars) {
    const toks = tokenize(src);
    let pos = 0;
    const peek = () => toks[pos];
    const take = (t) => { if (!toks[pos] || toks[pos].t !== t) throw new Error('Expected "' + t + '"'); return toks[pos++]; };

    function expr() {
      let left = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        const op = toks[pos++].t, a = left, b = term();
        left = op === '+' ? (v) => a(v) + b(v) : (v) => a(v) - b(v);
      }
      return left;
    }
    function startsPrimary(tk) { return tk && (tk.t === 'num' || tk.t === 'name' || tk.t === '('); }
    function term() {
      let left = unary();
      while (peek() && (peek().t === '*' || peek().t === '/' || startsPrimary(peek()))) {
        let op = '*';
        if (peek().t === '*' || peek().t === '/') op = toks[pos++].t;   // otherwise implicit "2t"
        const a = left, b = unary();
        left = op === '*' ? (v) => a(v) * b(v) : (v) => a(v) / b(v);
      }
      return left;
    }
    function unary() {
      if (peek() && peek().t === '-') { pos++; const a = unary(); return (v) => -a(v); }
      if (peek() && peek().t === '+') { pos++; return unary(); }
      return power();
    }
    function power() {
      const base = primary();
      if (peek() && peek().t === '^') { pos++; const ex = unary(); return (v) => Math.pow(base(v), ex(v)); }
      return base;
    }
    function primary() {
      const tk = toks[pos++];
      if (!tk) throw new Error('Unexpected end');
      if (tk.t === 'num') { const c = tk.v; return () => c; }
      if (tk.t === '(') { const e = expr(); take(')'); return e; }
      if (tk.t === 'name') {
        if (peek() && peek().t === '(' && FUNCS[tk.v]) {
          pos++;
          const args = [expr()];
          while (peek() && peek().t === ',') { pos++; args.push(expr()); }
          take(')');
          const fn = FUNCS[tk.v];
          return (v) => fn(...args.map((a) => a(v)));
        }
        if (tk.v in CONSTS) { const c = CONSTS[tk.v]; return () => c; }
        if (allowedVars.includes(tk.v)) { const name = tk.v; return (v) => v[name]; }
        throw new Error('Unknown name "' + tk.v + '"');
      }
      throw new Error('Unexpected "' + tk.t + '"');
    }
    const fn = expr();
    if (pos < toks.length) throw new Error('Extra input after position ' + pos);
    return fn;
  }
  return { compile };
})();

/* =====================================================================
   3. SETTINGS, VIEW, SCENE MODEL
   scene.objects is a flat list (like a Python list of dicts). Objects that
   connect to others store references {ref: id, a: anchorName} instead of
   coordinates, so they follow when the target moves.
   ===================================================================== */
let scene = newScene();
function newScene() {
  return {
    version: 2, nextId: 1, objects: [],
    settings: {
      pxPerM: 100, grid: 0.1, showGrid: true, snapGrid: true, labelPx: 19,
      g: 9.81,               // m/s^2, points down (-y)
      dt: 1 / 240,           // fixed physics time step (s)
      restThreshold: 0.05,   // m/s: slower impacts than this don't bounce (Box2D default is 1 m/s)
      velIters: 30,          // solver iterations (Box2D default 8) - more = stiffer joints/ropes
      posIters: 10,
    },
  };
}
const view = { ox: 60, oy: 500, zoom: 1, get ppm() { return scene.settings.pxPerM * this.zoom; } };

// world (m, y up) <-> screen (px, y down)
function S(p) { return { x: view.ox + p.x * view.ppm, y: view.oy - p.y * view.ppm }; }
function W(s) { return { x: (s.x - view.ox) / view.ppm, y: (view.oy - s.y) / view.ppm }; }

const byId = (id) => scene.objects.find((o) => o.id === id);
const uid = () => 'o' + (scene.nextId++);

/* =====================================================================
   4. OBJECT TYPES
   DEF[type]() gives default properties. META tells the editor which fields
   are points (possibly anchored) and the drawing layer order.
   ===================================================================== */
// Physical properties shared by every body. Iover = moment of inertia override ('' = compute from shape).
// vx, vy, omega are the initial conditions at t = 0.
const PHYS = () => ({ mass: 1, fixed: false, mu_s: 1.0, mu_k: 1.0, e: 0, collide: true, stick: false, Iover: '', vx: 0, vy: 0, omega: 0, labelDx: 0, labelDy: 0 });
const DEF = {
  surface: () => ({ kind: 'line', pts: [], side: 1, hatch: true, mu_s: 0.5, mu_k: 0.3, e: 0 }),
  block: () => ({ x: 0, y: 0, w: 1.2, h: 0.7, angle: 0, fill: 'gray', label: 'm', ...PHYS() }),
  cart: () => ({ x: 0, y: 0, w: 1.4, h: 0.6, angle: 0, wheelR: 0.11, fill: 'white', rolling: false, label: 'm', ...PHYS() }),
  disk: () => ({ x: 0, y: 0, r: 0.4, angle: 0, fill: 'gray', shape: 'solid disk', centerPin: true, showR: false, rLabel: 'r', label: '', ...PHYS() }),
  rod: () => ({ x: 0, y: 0, len: 1, angle: 0, width: 3, label: '', ...PHYS(), mass: 0.5 }),
  pointmass: () => ({ x: 0, y: 0, style: 'mass', size: 9, label: 'm', ...PHYS(), labelDx: 0.22, labelDy: 0.12 }),
  // pulley: mass 0 = ideal massless pulley (rope slides, equal tension both sides);
  //         mass > 0 = real pulley (rope can't slip, pulley spins). fixed = axle fixed in place.
  pulley: () => ({ x: 0, y: 0, r: 0.17, angle: 0, fill: 'white', mount: 'none', mountAngle: -90, mountLen: 30, shape: 'solid disk', label: '', ...PHYS(), fixed: true, mass: 0 }),
  pin: () => ({ p: { x: 0, y: 0 }, mount: 'none', mountAngle: -90, mountLen: 24, torsionK: 0, show: true }),
  weld: () => ({ p: { x: 0, y: 0 }, show: false }),
  track: () => ({ a: { x: 0, y: 0 }, b: { x: 1, y: 0 }, width: 12, hatch: false, rotate: false }),
  spring: () => ({ a: null, b: null, style: 'zigzag', coils: 8, amp: 8, nonlinear: false, k: 100, k2: 100, k3: 0, restLen: 1, label: 'k', labelSide: 1 }),
  damper: () => ({ a: null, b: null, c: 1, label: 'c', labelSide: 1 }),
  springdamper: () => ({ a: null, b: null, style: 'zigzag', coils: 6, amp: 7, nonlinear: false, k: 100, k2: 100, k3: 0, c: 1, restLen: 1, labelK: 'k', labelC: 'c', swap: false }),
  actuator: () => ({ a: null, b: null, law: '0', restLen: 1, showRL: false, label: '', labelRL: 'R_L', K: 1, RL: 1, labelSide: 1 }),
  rope: () => ({ a: null, b: null, via: [], slack: 0, label: '' }),
  force: () => ({ p: null, angle: 0, len: 0.7, at: 'tail', frame: 'world', law: '5', label: 'F' }),
  moment: () => ({ p: null, r: 0.25, start: 200, sweep: -110, law: '1', label: 'M' }),
  line: () => ({ a: null, b: null, dash: 'solid', weight: 1 }),
  dim: () => ({ a: null, b: null, orient: 'aligned', off: 0.3, label: '\\ell', showValue: false }),
  angle: () => ({ v: null, r: null, t: null, rad: 0.45, arrows: 'end', showRef: true, label: '\\theta', showValue: false }),
  coord: () => ({ p: { x: 0, y: 0 }, angle: 0, label: 'x_1' }),
  axes: () => ({ p: { x: 0, y: 0 }, angle: 0, lenX: 0.8, lenY: 0.8, yDir: 1, labelX: 'X', labelY: 'Y' }),
  gravity: () => ({ p: { x: 0, y: 0 }, len: 0.35, label: 'g' }),
  leader: () => ({ a: null, b: null, label: 'A' }),
  text: () => ({ p: { x: 0, y: 0 }, label: 'A' }),
};
const META = {
  surface: { layer: 0, name: 'Surface' },
  track: { layer: 1, pts: ['a', 'b'], name: 'Slider track' },
  block: { layer: 2, body: true, rot: true, name: 'Block' },
  cart: { layer: 2, body: true, rot: true, name: 'Cart' },
  disk: { layer: 2, body: true, rot: true, name: 'Disk' },
  rod: { layer: 2, body: true, rot: true, name: 'Rod' },
  pointmass: { layer: 2, body: true, name: 'Point mass' },
  pulley: { layer: 2, body: true, name: 'Pulley' },
  spring: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Spring' },
  damper: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Damper' },
  springdamper: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Spring + damper' },
  actuator: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Actuator' },
  rope: { layer: 4, pts: ['a', 'b'], name: 'Rope' },
  pin: { layer: 5, pts: ['p'], name: 'Pin' },
  weld: { layer: 5, pts: ['p'], name: 'Weld' },
  force: { layer: 6, pts: ['p'], name: 'Force' },
  moment: { layer: 6, pts: ['p'], name: 'Moment' },
  line: { layer: 7, pts: ['a', 'b'], name: 'Line' },
  dim: { layer: 7, pts: ['a', 'b'], name: 'Dimension' },
  angle: { layer: 7, pts: ['v', 'r', 't'], name: 'Angle arc' },
  coord: { layer: 7, pts: ['p'], name: 'Coordinate marker' },
  axes: { layer: 7, pts: ['p'], name: 'Axes' },
  gravity: { layer: 7, pts: ['p'], name: 'Gravity arrow' },
  leader: { layer: 7, pts: ['a', 'b'], name: 'Leader line' },
  text: { layer: 7, pts: ['p'], name: 'Label' },
};

// Body-local coordinates -> world. (lx, ly) are measured in the body's own rotated frame.
function L2W(o, lx, ly) {
  const c = Math.cos(o.angle || 0), s = Math.sin(o.angle || 0);
  return { x: o.x + c * lx - s * ly, y: o.y + s * lx + c * ly };
}

// Every snap-able point on an object, as [{name, p}] in world coords.
function anchorsOf(o) {
  const out = [];
  const add = (name, p) => out.push({ name, p });
  switch (o.type) {
    case 'block': case 'cart': {
      const hw = o.w / 2, hh = o.h / 2;
      add('c', L2W(o, 0, 0));
      add('tl', L2W(o, -hw, hh)); add('tr', L2W(o, hw, hh)); add('bl', L2W(o, -hw, -hh)); add('br', L2W(o, hw, -hh));
      // edge midpoints and quarter points (25 = toward the negative end of the edge)
      for (const [q, k] of [[-0.25, '25'], [0, ''], [0.25, '75']]) {
        add('t' + k, L2W(o, q * o.w, hh)); add('b' + k, L2W(o, q * o.w, -hh));
        add('l' + k, L2W(o, -hw, q * o.h)); add('r' + k, L2W(o, hw, q * o.h));
      }
      if (o.type === 'cart') { add('wl', L2W(o, -o.w * 0.3, -hh - o.wheelR)); add('wr', L2W(o, o.w * 0.3, -hh - o.wheelR)); }
      break;
    }
    case 'disk': case 'pulley':
      add('c', { x: o.x, y: o.y });

/* =====================================================================
   8. RENDERING THE SCENE

const ui = { tool: 'select', pending: [], rope: null, mouseW: { x: 0, y: 0 }, snap: null, drag: null, sel: new Set(), handles: [], space: false };

function sortedObjects() {
  return scene.objects.map((o, i) => [o, i]).sort((a, b) => (META[a[0].type].layer - META[b[0].type].layer) || (a[1] - b[1])).map((x) => x[0]);

function sceneMarkup() {

    s += `<g data-id="${o.id}" class="obj">${body}</g>`;

}

  for (let x = Math.floor(tl.x / step) * step; x <= br.x; x += step) {

    (major ? (dMajor += `M${sx} 0V${h}`) : (d += `M${sx} 0V${h}`));

  for (let y = Math.floor(br.y / step) * step; y <= tl.y; y += step) {

}

    `<text x="${x0 + px / 2}" y="${y0 - 8}" font-size="11" text-anchor="middle" fill="#555" font-family="system-ui">${L} m</text></g>`;
}
function render() {
  $('gridG').innerHTML = gridMarkup();
  $('sceneG').innerHTML = sceneMarkup();
  $('overlay').innerHTML = overlayMarkup();

// Editor-only overlay: selection boxes, handles, snap marker, ghost preview, scale bar.
function overlayMarkup() {
  let s = '';

    const g = $('sceneG').querySelector(`[data-id="${id}"]`);
    if (!g) continue;
    const bb = g.getBBox();
    s += `<rect x="${f(bb.x - 4)}" y="${f(bb.y - 4)}" width="${f(bb.width + 8)}" height="${f(bb.height + 8)}" fill="none" stroke="var(--sel)" stroke-dasharray="4 3" stroke-width="1"/>`;

        s += `<circle class="handle" data-h="${i}" cx="${f(c.x)}" cy="${f(c.y)}" r="6" fill="#fff" stroke="var(--sel)" stroke-width="1.5"/>`;
      } else {

// Initial-velocity arrows (editor only, shown at t = 0). Arrow length: 1 m/s is drawn as V0_SCALE meters.
const V0_SCALE = 0.2;
function initialVelocityMarkup() {
  let s = '';
  for (const o of scene.objects) {

    const c = S(o), tip = S({ x: o.x + o.vx * V0_SCALE, y: o.y + o.vy * V0_SCALE });
    const dir = V.unit(V.sub(tip, c));
    s += `<path d="M${f(c.x)} ${f(c.y)}L${f(tip.x - dir.x * 8)} ${f(tip.y - dir.y * 8)}" stroke="var(--sel)" stroke-width="2"/>`;
    s += `<path d="${pathD([tip, V.add(V.sub(tip, V.mul(dir, 10)), V.mul(V.perp(dir), 4)), V.sub(V.sub(tip, V.mul(dir, 10)), V.mul(V.perp(dir), 4))], true)}" fill="var(--sel)"/>`;
    s += `<text x="${f(tip.x + dir.x * 8)}" y="${f(tip.y + dir.y * 8 - 4)}" font-size="11" fill="var(--sel)" font-family="system-ui">v₀ = ${Math.hypot(o.vx, o.vy).toFixed(2)} m/s</text>`;

// Draggable handles for the selected object: endpoints, vertices, rotation.
function handlesOf(o) {
  const hs = [];
  const m = META[o.type];
  if (m.pts) for (const k of m.pts) if (o[k]) hs.push({ id: o.id, key: k, pos: P(o[k]) });
  if (o.type === 'force') {
    const p = P(o.p), d = V.dir(toRad(o.angle));

  }

  if (m.rot && o.type !== 'rod') {

    const reach = (o.h || o.r * 2 || 0.5) / 2 + 40 / view.ppm;

/* =====================================================================
   9. SNAPPING
   Priority: anchor points within 10 px  >  15-degree angle lock (Shift)  >  grid.
   Hold Alt to turn snapping off.
   ===================================================================== */
function snapPoint(w, e, exclude = new Set()) {

  if (e && e.shiftKey && base) {                       // angle lock relative to the previous point
    const d = V.sub(w, base), L = V.len(d);
    const a = toRad(Math.round(toDeg(Math.atan2(d.y, d.x)) / 15) * 15);
    let Ls = L;
    if (scene.settings.snapGrid) Ls = Math.round(L / scene.settings.grid) * scene.settings.grid;
    return V.add(base, V.mul(V.dir(a), Ls));

  if (e && e.altKey) return { x: w.x, y: w.y };

    for (const an of anchorsOf(o)) {

      if (d < bestD) { bestD = d; best = { x: an.p.x, y: an.p.y, ref: o.id, a: an.name }; }

  if (best) return best;
  if (scene.settings.snapGrid) { const g = scene.settings.grid; return { x: Math.round(w.x / g) * g, y: Math.round(w.y / g) * g }; }

  force: { group: 'Loads', name: 'Force', key: 'f', mode: 'two', hint: 'Click the point of application, then the arrow direction.', make: (p) => { const d = V.sub(p[1], p[0]); return mk('force', { p: copyPt(p[0]), angle: toDeg(Math.atan2(d.y, d.x)), len: Math.max(0.1, V.len(d)) }); } },
  moment: { group: 'Loads', name: 'Moment', mode: 'one', make: (p) => mk('moment', { p: copyPt(p[0]) }) },
  velocity: { group: 'Loads', name: 'Initial velocity', mode: 'drag', hint: 'Drag from a body to set its velocity at t = 0 (1 m/s is drawn 0.2 m long; Shift = 15° steps). Type ω₀ in the panel.' },
  line: { group: 'Annotations', name: 'Line', key: 'l', mode: 'two', make: (p) => mk('line', { a: copyPt(p[0]), b: copyPt(p[1]) }) },
  dim: { group: 'Annotations', name: 'Dimension', mode: 'two', make: (p) => mk('dim', { a: copyPt(p[0]), b: copyPt(p[1]) }) },
  angle: { group: 'Annotations', name: 'Angle arc', mode: 'three', hint: 'Click the vertex, a point on the reference line, then the target point.', make: (p) => p.length < 3 ? mk('line', { a: copyPt(p[0]), b: copyPt(p[1]), dash: 'dashdot' }) : mk('angle', { v: copyPt(p[0]), r: copyPt(p[1]), t: copyPt(p[2]) }) },
  coord: { group: 'Annotations', name: 'Coordinate marker', mode: 'one', make: (p) => mk('coord', { p: copyPt(p[0]) }) },
  axes: { group: 'Annotations', name: 'Axes', mode: 'one', make: (p) => mk('axes', { p: copyPt(p[0]) }) },
  gravity: { group: 'Annotations', name: 'Gravity arrow', mode: 'one', make: (p) => mk('gravity', { p: xy(p[0]) }) },
  leader: { group: 'Annotations', name: 'Leader + label', mode: 'two', hint: 'Click where the label goes, then the part it points to.', make: (p) => mk('leader', { a: xy(p[0]), b: copyPt(p[1]) }) },
  text: { group: 'Annotations', name: 'Label', key: 't', mode: 'one', make: (p) => mk('text', { p: copyPt(p[0]) }) },
};
const NEED = { one: 1, two: 2, three: 3 };

function setTool(t) {
  if (run.sim && t !== 'select') { msg('Reset the simulation (t = 0) to edit.'); t = 'select'; }
  ui.tool = t; ui.pending = []; ui.rope = null;
  document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('active', b.dataset.tool === t));
  const T = TOOLS[t];
  $('stHint').textContent = T.hint || (T.mode === 'one' ? 'Click to place.' : T.mode === 'two' ? 'Click two points (Shift = 15° steps; type length, angle in the top bar).' : T.mode === 'poly' ? 'Click points; double-click or Enter to finish.' : '');
  updateExactBox();
  render();
}
function updateExactBox() {
  const T = TOOLS[ui.tool];
  $('exactBox').style.display = (T.mode === 'two' || T.mode === 'poly') && ui.pending.length ? 'inline' : 'none';
}
// Ghost preview of the object being created, following the mouse.
function ghostObject() {
  const T = TOOLS[ui.tool];
  if (!ui.snap || T.mode === 'select' || T.mode === 'drag') return null;
  if (T.mode === 'rope') {
    if (!ui.rope) return null;
    return { ...mk('rope', { a: ui.rope.a, b: ui.snap, via: ui.rope.via }) };
  }
  const pts = [...ui.pending, ui.snap];
  if (T.mode === 'poly') return pts.length >= 2 ? T.make(pts) : null;
  if (T.mode === 'three' && pts.length === 2 && ui.tool === 'arc') return mk('surface', { pts: pts.map(xy) });
  if (pts.length < Math.min(NEED[T.mode], 2) && T.mode !== 'one') return null;
  return T.make(pts);
}
function addObject(o) {
  o.id = uid();
  if (o.type === 'block' || o.type === 'cart' || o.type === 'pointmass') o.label = autoLabel();
  scene.objects.push(o);
  ui.sel = new Set([o.id]);
  commit(); render(); showPanel();
  return o;
}
function autoLabel() {
  const n = scene.objects.filter((o) => ['block', 'cart', 'pointmass'].includes(o.type)).length + 1;
  return 'm_' + n;
}
function toolClick(e, w) {
  const T = TOOLS[ui.tool];
  const p = snapPoint(w, e);
  if (T.mode === 'rope') return ropeClick(e, p, w);
  ui.pending.push(p);
  if (T.mode !== 'poly' && ui.pending.length >= NEED[T.mode]) {
    const o = T.make(ui.pending);
    ui.pending = [];
    addObject(o);
  }
  updateExactBox(); render();
}
function finishPoly() {
  // remove duplicate points created by the double-click
  const pts = ui.pending.filter((p, i, a) => i === 0 || V.dist(p, a[i - 1]) > 1e-9);
  ui.pending = [];
  if (pts.length >= 2) addObject(TOOLS.polyline.make(pts));
  updateExactBox(); render();
}
function ropeClick(e, p, w) {
  if (!ui.rope) { ui.rope = { a: copyPt(p), via: [] }; render(); return; }
  const g = e.target.closest && e.target.closest('[data-id]');
  const q = g && byId(g.dataset.id);
  if (q && (q.type === 'pulley' || q.type === 'disk') && !e.altKey && !ui.rope.via.some((v) => v.id === q.id)) {
    // Which side of the pulley did you click? Left of the line (previous point -> center)
    // means the rope passes on the left, so it goes around clockwise (s = -1).
    const prev = ropeLastPoint(), C = { x: q.x, y: q.y };
    const s = V.cross(V.sub(C, prev), V.sub(w, prev)) > 0 ? -1 : 1;
    ui.rope.via.push({ id: q.id, s });
    render(); return;
  }
  const o = mk('rope', { a: ui.rope.a, b: copyPt(p), via: ui.rope.via });
  ui.rope = null;
  addObject(o);
}
function exactEntry() {
  const m = $('exact').value.split(',').map((s) => parseFloat(s));
  if (!ui.pending.length || !isFinite(m[0])) return;
  const ang = isFinite(m[1]) ? m[1] : 0;
  const base = ui.pending[ui.pending.length - 1];
  const p = V.add(base, V.mul(V.dir(toRad(ang)), m[0]));
  $('exact').value = '';
  ui.pending.push(p);
  const T = TOOLS[ui.tool];
  if (T.mode !== 'poly' && ui.pending.length >= NEED[T.mode]) { const o = T.make(ui.pending); ui.pending = []; addObject(o); }
  updateExactBox(); render();
}

/* =====================================================================
   11. MOUSE / KEYBOARD
   ===================================================================== */
function screenPt(e) { const r = $('svg').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

// Move an object by world displacement d. Anchored points stay attached to their targets.
function translate(o, d) {
  if (META[o.type].body) { o.x += d.x; o.y += d.y; }
  if (o.type === 'surface') o.pts = o.pts.map((p) => V.add(p, d));
  for (const k of META[o.type].pts || []) {
    const p = o[k];
    if (p && !p.ref) { p.x += d.x; p.y += d.y; }
  }
}

function initPointer() {
  const svg = $('svg');
  svg.addEventListener('contextmenu', (e) => e.preventDefault());
  svg.addEventListener('pointerdown', (e) => {
    const s = screenPt(e), w = W(s);
    if (e.button === 1 || e.button === 2 || ui.space) {
      ui.drag = { kind: 'pan', s0: s, ox: view.ox, oy: view.oy };
      svg.setPointerCapture(e.pointerId); return;
    }
    if (e.button !== 0) return;
    if (ui.tool === 'select') {
      const hEl = e.target.closest('[data-h]');
      if (hEl && !run.sim) { ui.drag = { kind: 'handle', h: ui.handles[+hEl.dataset.h], moved: false }; svg.setPointerCapture(e.pointerId); return; }
      const g = e.target.closest('[data-id]');
      if (g) {
        const id = g.dataset.id;
        if (e.shiftKey) { ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); }
        else if (!ui.sel.has(id)) ui.sel = new Set([id]);
        if (!run.sim) {                                // while simulating you can select but not move
          ui.drag = { kind: 'move', last: snapGridOnly(w), moved: false };
          svg.setPointerCapture(e.pointerId);
        }
      } else ui.sel.clear();
      render(); showPanel(); return;
    }
    if (run.sim) { msg('Reset the simulation (t = 0) to edit.'); return; }
    if (TOOLS[ui.tool].mode === 'drag') {              // initial-velocity tool: start dragging from a body
      const g = e.target.closest('[data-id]');
      const o = g && byId(g.dataset.id);
      if (o && META[o.type].body) {
        ui.sel = new Set([o.id]);
        ui.drag = { kind: 'vel', id: o.id, moved: false };
        svg.setPointerCapture(e.pointerId);
      } else msg('Start the drag on a body.');
      return;
    }
    toolClick(e, w);
  });
  svg.addEventListener('pointermove', (e) => {
    const s = screenPt(e), w = W(s);
    ui.mouseW = w;
    $('stPos').textContent = `x = ${w.x.toFixed(2)} m, y = ${w.y.toFixed(2)} m`;
    const d = ui.drag;
    if (d && d.kind === 'pan') { view.ox = d.ox + s.x - d.s0.x; view.oy = d.oy + s.y - d.s0.y; render(); return; }
    if (d && d.kind === 'move') {
      const now = snapGridOnly(w), delta = V.sub(now, d.last);
      if (delta.x || delta.y) { for (const id of ui.sel) translate(byId(id), delta); d.last = now; d.moved = true; render(); }
      return;
    }
    if (d && d.kind === 'handle') {
      const o = byId(d.h.id);
      const p = d.h.key === 'rot' ? w : snapPoint(w, e, new Set([o.id]));
      setHandle(o, d.h.key, p, e); d.moved = true; render(); return;
    }
    if (d && d.kind === 'vel') {                       // v0 = (drag vector) / V0_SCALE
      const o = byId(d.id);
      let v = V.mul(V.sub(w, o), 1 / V0_SCALE);
      if (e.shiftKey) { const a = toRad(Math.round(toDeg(Math.atan2(v.y, v.x)) / 15) * 15); v = V.mul(V.dir(a), V.len(v)); }
      o.vx = Math.round(v.x * 100) / 100; o.vy = Math.round(v.y * 100) / 100;
      d.moved = true; render(); return;
    }
    ui.snap = (ui.tool === 'select' || TOOLS[ui.tool].mode === 'drag') ? null : snapPoint(w, e);
    if (ui.tool !== 'select') render();
  });
  svg.addEventListener('pointerup', () => {
    const d = ui.drag; ui.drag = null;
    if (d && d.moved) { commit(); showPanel(); }
  });
  svg.addEventListener('dblclick', () => { if (TOOLS[ui.tool].mode === 'poly') finishPoly(); });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const s = screenPt(e), w = W(s);
    view.zoom = Math.min(20, Math.max(0.1, view.zoom * Math.pow(1.0015, -e.deltaY)));
    view.ox = s.x - w.x * view.ppm; view.oy = s.y + w.y * view.ppm;   // keep the point under the cursor fixed
    render();
  }, { passive: false });
}
function snapGridOnly(w) {
  if (!scene.settings.snapGrid) return w;
  const g = scene.settings.grid; return { x: Math.round(w.x / g) * g, y: Math.round(w.y / g) * g };
}

function initKeys() {
  window.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.target === $('exact') && e.key === 'Enter') { exactEntry(); return; }
    if (typing) return;
    const ctrl = e.ctrlKey || e.metaKey;
    // While a simulation exists (t > 0), the scene is read-only: Reset first.
    const editKey = (ctrl && 'zyvd'.includes(e.key.toLowerCase())) || e.key === 'Delete' || e.key === 'Backspace' || (e.key === 'r' && ui.tool === 'select');
    if (run.sim && editKey) { msg('Reset the simulation (t = 0) to edit.'); return; }
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (ctrl && e.key.toLowerCase() === 'c') { copySel(); return; }
    if (ctrl && e.key.toLowerCase() === 'v') { paste(); return; }
    if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); copySel(); paste(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); return; }
    if (e.key === 'Escape') { if (ui.pending.length || ui.rope) { ui.pending = []; ui.rope = null; updateExactBox(); render(); } else setTool('select'); return; }
    if (e.key === 'Enter' && TOOLS[ui.tool].mode === 'poly') { finishPoly(); return; }
    if (e.key === ' ') { ui.space = true; e.preventDefault(); return; }
    if (e.key.toLowerCase() === 'f' && !ctrl && ui.tool === 'select' && !e.shiftKey) { fitView(); return; }
    if (e.key === 'r' && ui.tool === 'select' && ui.sel.size) {     // R rotates the selection 15 degrees
      for (const id of ui.sel) { const o = byId(id); if (META[o.type].rot) o.angle += toRad(e.shiftKey ? -15 : 15); }
      commit(); render(); showPanel(); return;
    }
    if (ctrl || e.altKey) return;
    for (const [t, T] of Object.entries(TOOLS)) if (T.key === e.key.toLowerCase() && !(ui.tool === 'select' && ['f', 'r'].includes(T.key))) { setTool(t); return; }
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ') ui.space = false; });
}

function fitView() {
  render();
  const g = $('sceneG');
  if (!scene.objects.length) return;
  const bb = g.getBBox(), svg = $('svg');
  const k = Math.min((svg.clientWidth - 80) / bb.width, (svg.clientHeight - 80) / bb.height);
  const w0 = W({ x: bb.x, y: bb.y + bb.height });
  view.zoom = Math.min(10, Math.max(0.1, view.zoom * k));
  const scaledW = bb.width * k, scaledH = bb.height * k;
  const left = (svg.clientWidth - scaledW) / 2, bottom = (svg.clientHeight + scaledH) / 2;
  view.ox = left - w0.x * view.ppm; view.oy = bottom + w0.y * view.ppm;
  render();
}

   ===================================================================== */
const hist = { stack: [], i: -1 };
function commit() {
  const s = JSON.stringify(scene);
  if (hist.stack[hist.i] === s) return;
  hist.stack.splice(hist.i + 1);
  hist.stack.push(s);
  if (hist.stack.length > 200) hist.stack.shift();
  hist.i = hist.stack.length - 1;
  try { localStorage.setItem('mechSandbox.autosave', s); } catch (e) { /* storage blocked: fine */ }
}
function restore(s) { scene = JSON.parse(s); ui.sel = new Set([...ui.sel].filter((id) => byId(id))); render(); showPanel(); }
function undo() { if (run.sim) return msg('Reset the simulation (t = 0) to edit.'); if (hist.i > 0) restore(hist.stack[--hist.i]); }

let clipboard = null;

function paste() {
  if (!clipboard || run.sim) return;
  const objs = JSON.parse(clipboard), map = {};
  for (const o of objs) { map[o.id] = uid(); }
  const d = { x: 0.2, y: -0.2 };
  for (const o of objs) {
    o.id = map[o.id];
    // references to objects that were copied too now point at the copies
    for (const k of META[o.type].pts || []) { const p = o[k]; if (p && p.ref && map[p.ref]) p.ref = map[p.ref]; else if (p && p.ref) { /* keep attached to original */ } }
    if (o.via) o.via.forEach((v) => { if (map[v.id]) v.id = map[v.id]; });
    translate(o, d);
    scene.objects.push(o);
  }

  commit(); render(); showPanel();
}
function deleteSel() {
  if (!ui.sel.size || run.sim) return;
  for (const o of scene.objects) {          // anything attached to a deleted object stays where it is
    for (const k of META[o.type].pts || []) { const p = o[k]; if (p && p.ref && ui.sel.has(p.ref)) { const q = P(p); o[k] = { x: q.x, y: q.y }; } }

}

  add('spring', { a: R(blk, 'r75'), b: free(5.5, 1.43), coils: 5, label: 'k' });
  add('damper', { a: free(-0.3, 0.86), b: R(blk, 'l25'), label: 'd', labelSide: -1 });
  add('leader', { a: free(1.75, 1.45), b: free(2.1, 1.74), label: '\\mu \\neq 0' });
});

/* =====================================================================
   16. STARTUP
   ===================================================================== */
function buildToolbar() {
  let h = '', group = '';
  for (const [t, T] of Object.entries(TOOLS)) {
    if (T.group !== group) { group = T.group; h += `<h4>${group}</h4>`; }
    h += `<button data-tool="${t}" title="${T.key ? 'Shortcut: ' + T.key.toUpperCase() : ''}">${T.name}</button>`;
  }
  $('tools').innerHTML = h;
  $('tools').querySelectorAll('button').forEach((b) => b.onclick = () => setTool(b.dataset.tool));
}
function init() {
  buildToolbar();
  initPointer(); initKeys();
  $('bNew').onclick = () => { scene = newScene(); ui.sel.clear(); commit(); render(); showPanel(); };
  $('bOpen').onclick = () => $('fileIn').click();
  $('fileIn').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    file.text().then((t) => { try { loadSceneObject(JSON.parse(t)); } catch (err) { msg('Could not read file: ' + err.message); } });
    e.target.value = '';
  };
  $('bSave').onclick = () => download('scene.json', JSON.stringify(scene, null, 1), 'application/json');
  $('examples').onchange = (e) => { const k = e.target.value; if (EX[k]) EX[k](); e.target.value = ''; };
  $('bUndo').onclick = undo; $('bRedo').onclick = redo; $('bDel').onclick = deleteSel; $('bFit').onclick = fitView;
  $('bSvg').onclick = () => download('diagram.svg', exportSVGString(), 'image/svg+xml');
  $('bPng').onclick = exportPNG;
  window.addEventListener('resize', render);
  view.oy = $('svg').clientHeight - 60;
  let saved = null;
  try { saved = localStorage.getItem('mechSandbox.autosave'); } catch (e) { saved = null; }
  if (saved) { try { scene = JSON.parse(saved); } catch (e) { scene = newScene(); } }
  commit();
  setTool('select');
  showPanel();
  if (saved) fitView();
}
window.onMathReady = () => { TEX.ready = true; TEX.cache.clear(); render(); showPanel(); };
init();
if (window.MathJax && MathJax.tex2svg) window.onMathReady();
</script>
