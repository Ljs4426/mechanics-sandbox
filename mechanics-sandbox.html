<!--
  MECHANICS SANDBOX - Phase 2 (editor + core physics)
  ---------------------------------------------------
  One self-contained file. Sections in the <script> below:
    1. Utilities (vector math)
    2. Safe expression parser (no eval)
    3. Settings, view, scene model
    4. Object types: defaults, anchors, point fields
    5. LaTeX labels (MathJax SVG)
    6. SVG drawing primitives (hatching, arrows, springs, dampers...)
    7. Per-type renderers
    8. Rendering the whole scene + overlay
    9. Snapping
   10. Tools (creating objects)
   11. Mouse / keyboard interaction
   12. Properties panel
   13. Undo/redo, clipboard, delete
   14. Save / load / export
   15. Example scenes (the 4 reference diagrams)
   16. Physics: building a Planck world from the scene
   17. Physics: custom rope constraint (ropes over pulleys)
   18. Simulation controls (play / pause / step / reset, fixed time step)
   19. Built-in tests
   20. Startup
  Coordinates: the scene is stored in METERS with +y UP (textbook convention).
  Only the renderer converts to screen pixels (where SVG's +y is DOWN).
-->

  .row input.bad { border-color: #c00; background: #fee; }

  #testBox[hidden] { display: none; }

  .pass { color: #070; font-weight: 600; } .fail { color: #b00; font-weight: 600; }
</style>

<script>
'use strict';
/* =====================================================================
   1. UTILITIES
   Small 2D vector helpers. Points are plain objects {x, y}
   (like a Python dict or a namedtuple).
   ===================================================================== */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, s) => ({ x: a.x * s, y: a.y * s }),
  len: (a) => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  unit: (a) => { const L = Math.hypot(a.x, a.y) || 1; return { x: a.x / L, y: a.y / L }; },
  perp: (a) => ({ x: -a.y, y: a.x }),            // rotate +90 degrees
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,        // z-component of the 3D cross product
  dir: (ang) => ({ x: Math.cos(ang), y: Math.sin(ang) }),
};
const toDeg = (r) => r * 180 / Math.PI;
const toRad = (d) => d * Math.PI / 180;
const TAU = 2 * Math.PI;
const mod = (a, n) => ((a % n) + n) % n;
const f = (n) => Math.round(n * 100) / 100;      // trim numbers written into SVG
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);

/* =====================================================================
   2. SAFE EXPRESSION PARSER
   Turns text like "5 sin(2t)" into a function of variables, WITHOUT eval().
   Grammar (recursive descent, one function per rule):
     expr    := term (('+' | '-') term)*
     term    := unary (('*' | '/' | implicit) unary)*
     unary   := ('-' | '+') unary | power
     power   := primary ('^' unary)?
     primary := number | name | name '(' args ')' | '(' expr ')'
   compile() returns a JavaScript closure - think of it as building a tree of
   Python lambdas, then calling the root lambda with a dict of variables.
   ===================================================================== */
const Expr = (function () {
  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, sqrt: Math.sqrt,
    abs: Math.abs, log: Math.log, sign: Math.sign, min: Math.min, max: Math.max,
    step: (x) => (x >= 0 ? 1 : 0),               // Heaviside step u(x)
  };
  const CONSTS = { pi: Math.PI, e: Math.E };

  function tokenize(src) {
    const toks = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(src.slice(i));
        if (!m) throw new Error('Bad number at ' + i);
        toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        const m = /^[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(i));
        toks.push({ t: 'name', v: m[0] }); i += m[0].length; continue;
      }
      if ('+-*/^(),'.includes(c)) { toks.push({ t: c }); i++; continue; }
      throw new Error('Unexpected "' + c + '"');
    }
    return toks;
  }

  function compile(src, allowedVars) {
    const toks = tokenize(src);
    let pos = 0;
    const peek = () => toks[pos];
    const take = (t) => { if (!toks[pos] || toks[pos].t !== t) throw new Error('Expected "' + t + '"'); return toks[pos++]; };

    function expr() {
      let left = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        const op = toks[pos++].t, a = left, b = term();
        left = op === '+' ? (v) => a(v) + b(v) : (v) => a(v) - b(v);
      }
      return left;
    }
    function startsPrimary(tk) { return tk && (tk.t === 'num' || tk.t === 'name' || tk.t === '('); }
    function term() {
      let left = unary();
      while (peek() && (peek().t === '*' || peek().t === '/' || startsPrimary(peek()))) {
        let op = '*';
        if (peek().t === '*' || peek().t === '/') op = toks[pos++].t;   // otherwise implicit "2t"
        const a = left, b = unary();
        left = op === '*' ? (v) => a(v) * b(v) : (v) => a(v) / b(v);
      }
      return left;
    }
    function unary() {
      if (peek() && peek().t === '-') { pos++; const a = unary(); return (v) => -a(v); }
      if (peek() && peek().t === '+') { pos++; return unary(); }
      return power();
    }
    function power() {
      const base = primary();
      if (peek() && peek().t === '^') { pos++; const ex = unary(); return (v) => Math.pow(base(v), ex(v)); }
      return base;
    }
    function primary() {
      const tk = toks[pos++];
      if (!tk) throw new Error('Unexpected end');
      if (tk.t === 'num') { const c = tk.v; return () => c; }
      if (tk.t === '(') { const e = expr(); take(')'); return e; }
      if (tk.t === 'name') {
        if (peek() && peek().t === '(' && FUNCS[tk.v]) {
          pos++;
          const args = [expr()];
          while (peek() && peek().t === ',') { pos++; args.push(expr()); }
          take(')');
          const fn = FUNCS[tk.v];
          return (v) => fn(...args.map((a) => a(v)));
        }
        if (tk.v in CONSTS) { const c = CONSTS[tk.v]; return () => c; }
        if (allowedVars.includes(tk.v)) { const name = tk.v; return (v) => v[name]; }
        throw new Error('Unknown name "' + tk.v + '"');
      }
      throw new Error('Unexpected "' + tk.t + '"');
    }
    const fn = expr();
    if (pos < toks.length) throw new Error('Extra input after position ' + pos);
    return fn;
  }
  return { compile };
})();

/* =====================================================================
   3. SETTINGS, VIEW, SCENE MODEL
   scene.objects is a flat list (like a Python list of dicts). Objects that
   connect to others store references {ref: id, a: anchorName} instead of
   coordinates, so they follow when the target moves.
   ===================================================================== */
let scene = newScene();
function newScene() {
  return {
    version: 2, nextId: 1, objects: [],
    settings: {
      pxPerM: 100, grid: 0.1, showGrid: true, snapGrid: true, labelPx: 19,
      g: 9.81,               // m/s^2, points down (-y)
      dt: 1 / 240,           // fixed physics time step (s)
      restThreshold: 0.05,   // m/s: slower impacts than this don't bounce (Box2D default is 1 m/s)
      velIters: 30,          // solver iterations (Box2D default 8) - more = stiffer joints/ropes
      posIters: 10,
    },
  };
}
const view = { ox: 60, oy: 500, zoom: 1, get ppm() { return scene.settings.pxPerM * this.zoom; } };

// world (m, y up) <-> screen (px, y down)
function S(p) { return { x: view.ox + p.x * view.ppm, y: view.oy - p.y * view.ppm }; }
function W(s) { return { x: (s.x - view.ox) / view.ppm, y: (view.oy - s.y) / view.ppm }; }

const byId = (id) => scene.objects.find((o) => o.id === id);
const uid = () => 'o' + (scene.nextId++);

/* =====================================================================
   4. OBJECT TYPES
   DEF[type]() gives default properties. META tells the editor which fields
   are points (possibly anchored) and the drawing layer order.
   ===================================================================== */
// Physical properties shared by every body. Iover = moment of inertia override ('' = compute from shape).
// vx, vy, omega are the initial conditions at t = 0.
const PHYS = () => ({ mass: 1, fixed: false, mu_s: 1.0, mu_k: 1.0, e: 0, collide: true, stick: false, Iover: '', vx: 0, vy: 0, omega: 0, labelDx: 0, labelDy: 0 });
const DEF = {
  surface: () => ({ kind: 'line', pts: [], side: 1, hatch: true, mu_s: 0.5, mu_k: 0.3, e: 0 }),
  block: () => ({ x: 0, y: 0, w: 1.2, h: 0.7, angle: 0, fill: 'gray', label: 'm', ...PHYS() }),
  cart: () => ({ x: 0, y: 0, w: 1.4, h: 0.6, angle: 0, wheelR: 0.11, fill: 'white', rolling: false, label: 'm', ...PHYS() }),
  disk: () => ({ x: 0, y: 0, r: 0.4, angle: 0, fill: 'gray', shape: 'solid disk', centerPin: true, showR: false, rLabel: 'r', label: '', ...PHYS() }),
  rod: () => ({ x: 0, y: 0, len: 1, angle: 0, width: 3, label: '', ...PHYS(), mass: 0.5 }),
  pointmass: () => ({ x: 0, y: 0, style: 'mass', size: 9, label: 'm', ...PHYS(), labelDx: 0.22, labelDy: 0.12 }),
  // pulley: mass 0 = ideal massless pulley (rope slides, equal tension both sides);
  //         mass > 0 = real pulley (rope can't slip, pulley spins). fixed = axle fixed in place.
  pulley: () => ({ x: 0, y: 0, r: 0.17, angle: 0, fill: 'white', mount: 'none', mountAngle: -90, mountLen: 30, shape: 'solid disk', label: '', ...PHYS(), fixed: true, mass: 0 }),
  pin: () => ({ p: { x: 0, y: 0 }, mount: 'none', mountAngle: -90, mountLen: 24, torsionK: 0, show: true }),
  weld: () => ({ p: { x: 0, y: 0 }, show: false }),
  track: () => ({ a: { x: 0, y: 0 }, b: { x: 1, y: 0 }, width: 12, hatch: false, rotate: false }),
  spring: () => ({ a: null, b: null, style: 'zigzag', coils: 8, amp: 8, nonlinear: false, k: 100, k2: 100, k3: 0, restLen: 1, label: 'k', labelSide: 1 }),
  damper: () => ({ a: null, b: null, c: 1, label: 'c', labelSide: 1 }),
  springdamper: () => ({ a: null, b: null, style: 'zigzag', coils: 6, amp: 7, nonlinear: false, k: 100, k2: 100, k3: 0, c: 1, restLen: 1, labelK: 'k', labelC: 'c', swap: false }),
  actuator: () => ({ a: null, b: null, law: '0', restLen: 1, showRL: false, label: '', labelRL: 'R_L', K: 1, RL: 1, labelSide: 1 }),
  rope: () => ({ a: null, b: null, via: [], slack: 0, label: '' }),
  force: () => ({ p: null, angle: 0, len: 0.7, at: 'tail', frame: 'world', law: '5', label: 'F' }),
  moment: () => ({ p: null, r: 0.25, start: 200, sweep: -110, law: '1', label: 'M' }),
  line: () => ({ a: null, b: null, dash: 'solid', weight: 1 }),
  dim: () => ({ a: null, b: null, orient: 'aligned', off: 0.3, label: '\\ell', showValue: false }),
  angle: () => ({ v: null, r: null, t: null, rad: 0.45, arrows: 'end', showRef: true, label: '\\theta', showValue: false }),
  coord: () => ({ p: { x: 0, y: 0 }, angle: 0, label: 'x_1' }),
  axes: () => ({ p: { x: 0, y: 0 }, angle: 0, lenX: 0.8, lenY: 0.8, yDir: 1, labelX: 'X', labelY: 'Y' }),
  gravity: () => ({ p: { x: 0, y: 0 }, len: 0.35, label: 'g' }),
  leader: () => ({ a: null, b: null, label: 'A' }),
  text: () => ({ p: { x: 0, y: 0 }, label: 'A' }),
};
const META = {
  surface: { layer: 0, name: 'Surface' },
  track: { layer: 1, pts: ['a', 'b'], name: 'Slider track' },
  block: { layer: 2, body: true, rot: true, name: 'Block' },
  cart: { layer: 2, body: true, rot: true, name: 'Cart' },
  disk: { layer: 2, body: true, rot: true, name: 'Disk' },
  rod: { layer: 2, body: true, rot: true, name: 'Rod' },
  pointmass: { layer: 2, body: true, name: 'Point mass' },
  pulley: { layer: 2, body: true, name: 'Pulley' },
  spring: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Spring' },
  damper: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Damper' },
  springdamper: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Spring + damper' },
  actuator: { layer: 3, pts: ['a', 'b'], conn: true, name: 'Actuator' },
  rope: { layer: 4, pts: ['a', 'b'], name: 'Rope' },
  pin: { layer: 5, pts: ['p'], name: 'Pin' },
  weld: { layer: 5, pts: ['p'], name: 'Weld' },
  force: { layer: 6, pts: ['p'], name: 'Force' },
  moment: { layer: 6, pts: ['p'], name: 'Moment' },
  line: { layer: 7, pts: ['a', 'b'], name: 'Line' },
  dim: { layer: 7, pts: ['a', 'b'], name: 'Dimension' },
  angle: { layer: 7, pts: ['v', 'r', 't'], name: 'Angle arc' },
  coord: { layer: 7, pts: ['p'], name: 'Coordinate marker' },
  axes: { layer: 7, pts: ['p'], name: 'Axes' },
  gravity: { layer: 7, pts: ['p'], name: 'Gravity arrow' },
  leader: { layer: 7, pts: ['a', 'b'], name: 'Leader line' },
  text: { layer: 7, pts: ['p'], name: 'Label' },
};

// Body-local coordinates -> world. (lx, ly) are measured in the body's own rotated frame.
function L2W(o, lx, ly) {
  const c = Math.cos(o.angle || 0), s = Math.sin(o.angle || 0);
  return { x: o.x + c * lx - s * ly, y: o.y + s * lx + c * ly };
}

// Every snap-able point on an object, as [{name, p}] in world coords.
function anchorsOf(o) {
  const out = [];
  const add = (name, p) => out.push({ name, p });
  switch (o.type) {
    case 'block': case 'cart': {
      const hw = o.w / 2, hh = o.h / 2;
      add('c', L2W(o, 0, 0));
      add('tl', L2W(o, -hw, hh)); add('tr', L2W(o, hw, hh)); add('bl', L2W(o, -hw, -hh)); add('br', L2W(o, hw, -hh));
      // edge midpoints and quarter points (25 = toward the negative end of the edge)
      for (const [q, k] of [[-0.25, '25'], [0, ''], [0.25, '75']]) {
        add('t' + k, L2W(o, q * o.w, hh)); add('b' + k, L2W(o, q * o.w, -hh));
        add('l' + k, L2W(o, -hw, q * o.h)); add('r' + k, L2W(o, hw, q * o.h));
      }
      if (o.type === 'cart') { add('wl', L2W(o, -o.w * 0.3, -hh - o.wheelR)); add('wr', L2W(o, o.w * 0.3, -hh - o.wheelR)); }
      break;
    }
    case 'disk': case 'pulley':

  actuator(o) {

  rope(o) {

/* =====================================================================
   8. RENDERING THE SCENE

const ui = { tool: 'select', pending: [], rope: null, mouseW: { x: 0, y: 0 }, snap: null, drag: null, sel: new Set(), handles: [], space: false };

function sortedObjects() {
  return scene.objects.map((o, i) => [o, i]).sort((a, b) => (META[a[0].type].layer - META[b[0].type].layer) || (a[1] - b[1])).map((x) => x[0]);

    s += `<g data-id="${o.id}" class="obj">${body}</g>`;

}
function gridMarkup() {
  if (!scene.settings.showGrid) return '';

  const tl = W({ x: 0, y: 0 }), br = W({ x: w, y: h });

    (major ? (dMajor += `M${sx} 0V${h}`) : (d += `M${sx} 0V${h}`));

    (major ? (dMajor += `M0 ${sy}H${w}`) : (d += `M0 ${sy}H${w}`));

  const o = S({ x: 0, y: 0 });
  return `<path d="${d}" stroke="#f0f0f0" stroke-width="1"/><path d="${dMajor}" stroke="#e2e2e2" stroke-width="1"/>` +
    `<path d="M${f(o.x)} 0V${h}M0 ${f(o.y)}H${w}" stroke="#d4d4d4" stroke-width="1"/>`;
}

  const L = nice.find((n) => n * view.ppm >= 70) || 50, px = L * view.ppm;
  const x0 = 16, y0 = h - 18;
  return `<g><path d="M${x0} ${y0 - 5}V${y0}H${x0 + px}V${y0 - 5}" stroke="#555" stroke-width="1.5" fill="none"/>` +
    `<text x="${x0 + px / 2}" y="${y0 - 8}" font-size="11" text-anchor="middle" fill="#555" font-family="system-ui">${L} m</text></g>`;
}
let gridKey = '';
function render() {
  // Read the canvas size BEFORE changing the DOM (reading it afterwards forces an extra layout pass).
  const svg = $('svg');
  view.w = svg.clientWidth; view.h = svg.clientHeight;
  // The grid only changes when the view or grid settings change (not while a simulation runs).
  const gk = [view.ox, view.oy, view.ppm, view.w, view.h, scene.settings.showGrid, scene.settings.grid].join();
  if (gk !== gridKey) { gridKey = gk; $('gridG').innerHTML = gridMarkup(); }

// Editor-only overlay: selection boxes, handles, snap marker, ghost preview, scale bar.
function overlayMarkup() {
  let s = '';
  ui.handles = [];
  for (const id of ui.sel) {
    const g = $('sceneG').querySelector(`[data-id="${id}"]`);
    if (!g) continue;
    const bb = g.getBBox();
    s += `<rect x="${f(bb.x - 4)}" y="${f(bb.y - 4)}" width="${f(bb.width + 8)}" height="${f(bb.height + 8)}" fill="none" stroke="var(--sel)" stroke-dasharray="4 3" stroke-width="1"/>`;
    if (ui.sel.size === 1 && !run.sim) for (const h of handlesOf(byId(id))) {
      const i = ui.handles.push(h) - 1, c = S(h.pos);
      if (h.key === 'rot') {
        const cc = S(h.center);
        s += `<path d="M${f(cc.x)} ${f(cc.y)}L${f(c.x)} ${f(c.y)}" stroke="var(--sel)" stroke-width="1"/>`;
        s += `<circle class="handle" data-h="${i}" cx="${f(c.x)}" cy="${f(c.y)}" r="6" fill="#fff" stroke="var(--sel)" stroke-width="1.5"/>`;
      } else {

// Initial-velocity arrows (editor only, shown at t = 0). Arrow length: 1 m/s is drawn as V0_SCALE meters.
const V0_SCALE = 0.2;
function initialVelocityMarkup() {
  let s = '';
  for (const o of scene.objects) {

    const c = S(o), tip = S({ x: o.x + o.vx * V0_SCALE, y: o.y + o.vy * V0_SCALE });
    const dir = V.unit(V.sub(tip, c));
    s += `<path d="M${f(c.x)} ${f(c.y)}L${f(tip.x - dir.x * 8)} ${f(tip.y - dir.y * 8)}" stroke="var(--sel)" stroke-width="2"/>`;
    s += `<path d="${pathD([tip, V.add(V.sub(tip, V.mul(dir, 10)), V.mul(V.perp(dir), 4)), V.sub(V.sub(tip, V.mul(dir, 10)), V.mul(V.perp(dir), 4))], true)}" fill="var(--sel)"/>`;
    s += `<text x="${f(tip.x + dir.x * 8)}" y="${f(tip.y + dir.y * 8 - 4)}" font-size="11" fill="var(--sel)" font-family="system-ui">v₀ = ${Math.hypot(o.vx, o.vy).toFixed(2)} m/s</text>`;

// Draggable handles for the selected object: endpoints, vertices, rotation.
function handlesOf(o) {
  const hs = [];
  const m = META[o.type];
  if (m.pts) for (const k of m.pts) if (o[k]) hs.push({ id: o.id, key: k, pos: P(o[k]) });
  if (o.type === 'force') {
    const p = P(o.p), d = V.dir(toRad(o.angle));
    hs.push({ id: o.id, key: 'head', pos: o.at === 'tail' ? V.add(p, V.mul(d, o.len)) : V.sub(p, V.mul(d, o.len)) });
  }
  if (o.type === 'rod') { hs.push({ id: o.id, key: 'rodA', pos: L2W(o, -o.len / 2, 0) }, { id: o.id, key: 'rodB', pos: L2W(o, o.len / 2, 0) }); }
  if (o.type === 'surface' && o.kind !== 'arc') o.pts.forEach((p, i) => hs.push({ id: o.id, key: 'v' + i, pos: p }));
  if (m.rot && o.type !== 'rod') {
    const center = { x: o.x, y: o.y };
    const reach = (o.h || o.r * 2 || 0.5) / 2 + 40 / view.ppm;
    hs.push({ id: o.id, key: 'rot', center, pos: L2W(o, 0, reach) });

}

  }

/* =====================================================================
   9. SNAPPING
   Priority: anchor points within 10 px  >  15-degree angle lock (Shift)  >  grid.
   Hold Alt to turn snapping off.
   ===================================================================== */
function snapPoint(w, e, exclude = new Set()) {

  if (e && e.shiftKey && base) {                       // angle lock relative to the previous point
    const d = V.sub(w, base), L = V.len(d);
    const a = toRad(Math.round(toDeg(Math.atan2(d.y, d.x)) / 15) * 15);
    let Ls = L;
    if (scene.settings.snapGrid) Ls = Math.round(L / scene.settings.grid) * scene.settings.grid;
    return V.add(base, V.mul(V.dir(a), Ls));

  if (e && e.altKey) return { x: w.x, y: w.y };
  let best = null, bestD = 10;
  const ws = S(w);
  for (const o of scene.objects) {
    if (exclude.has(o.id)) continue;
    for (const an of anchorsOf(o)) {
      const d = V.dist(S(an.p), ws);
      if (d < bestD) { bestD = d; best = { x: an.p.x, y: an.p.y, ref: o.id, a: an.name }; }
    }
  }
  if (best) return best;
  if (scene.settings.snapGrid) { const g = scene.settings.grid; return { x: Math.round(w.x / g) * g, y: Math.round(w.y / g) * g }; }

/* =====================================================================

  moment: { group: 'Loads', name: 'Moment', mode: 'one', make: (p) => mk('moment', { p: copyPt(p[0]) }) },

  text: { group: 'Annotations', name: 'Label', key: 't', mode: 'one', make: (p) => mk('text', { p: copyPt(p[0]) }) },
};
const NEED = { one: 1, two: 2, three: 3 };

function setTool(t) {
  if (run.sim && t !== 'select') { msg('Reset the simulation (t = 0) to edit.'); t = 'select'; }
  ui.tool = t; ui.pending = []; ui.rope = null;
  document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('active', b.dataset.tool === t));
  const T = TOOLS[t];
  $('stHint').textContent = T.hint || (T.mode === 'one' ? 'Click to place.' : T.mode === 'two' ? 'Click two points (Shift = 15° steps; type length, angle in the top bar).' : T.mode === 'poly' ? 'Click points; double-click or Enter to finish.' : '');
  updateExactBox();
  render();
}
function updateExactBox() {
  const T = TOOLS[ui.tool];
  $('exactBox').style.display = (T.mode === 'two' || T.mode === 'poly') && ui.pending.length ? 'inline' : 'none';
}
// Ghost preview of the object being created, following the mouse.
function ghostObject() {
  const T = TOOLS[ui.tool];
  if (!ui.snap || T.mode === 'select' || T.mode === 'drag') return null;
  if (T.mode === 'rope') {
    if (!ui.rope) return null;
    return { ...mk('rope', { a: ui.rope.a, b: ui.snap, via: ui.rope.via }) };
  }
  const pts = [...ui.pending, ui.snap];
  if (T.mode === 'poly') return pts.length >= 2 ? T.make(pts) : null;
  if (T.mode === 'three' && pts.length === 2 && ui.tool === 'arc') return mk('surface', { pts: pts.map(xy) });
  if (pts.length < Math.min(NEED[T.mode], 2) && T.mode !== 'one') return null;
  return T.make(pts);
}
function addObject(o) {
  o.id = uid();
  if (o.type === 'block' || o.type === 'cart' || o.type === 'pointmass') o.label = autoLabel();
  scene.objects.push(o);
  ui.sel = new Set([o.id]);
  commit(); render(); showPanel();
  return o;
}
function autoLabel() {
  const n = scene.objects.filter((o) => ['block', 'cart', 'pointmass'].includes(o.type)).length + 1;
  return 'm_' + n;
}
function toolClick(e, w) {
  const T = TOOLS[ui.tool];
  const p = snapPoint(w, e);
  if (T.mode === 'rope') return ropeClick(e, p, w);
  ui.pending.push(p);
  if (T.mode !== 'poly' && ui.pending.length >= NEED[T.mode]) {
    const o = T.make(ui.pending);
    ui.pending = [];
    addObject(o);
  }
  updateExactBox(); render();
}
function finishPoly() {
  // remove duplicate points created by the double-click
  const pts = ui.pending.filter((p, i, a) => i === 0 || V.dist(p, a[i - 1]) > 1e-9);
  ui.pending = [];
  if (pts.length >= 2) addObject(TOOLS.polyline.make(pts));
  updateExactBox(); render();
}
function ropeClick(e, p, w) {
  if (!ui.rope) { ui.rope = { a: copyPt(p), via: [] }; render(); return; }
  const g = e.target.closest && e.target.closest('[data-id]');
  const q = g && byId(g.dataset.id);
  if (q && (q.type === 'pulley' || q.type === 'disk') && !e.altKey && !ui.rope.via.some((v) => v.id === q.id)) {
    // Which side of the pulley did you click? Left of the line (previous point -> center)
    // means the rope passes on the left, so it goes around clockwise (s = -1).
    const prev = ropeLastPoint(), C = { x: q.x, y: q.y };
    const s = V.cross(V.sub(C, prev), V.sub(w, prev)) > 0 ? -1 : 1;
    ui.rope.via.push({ id: q.id, s });
    render(); return;
  }
  const o = mk('rope', { a: ui.rope.a, b: copyPt(p), via: ui.rope.via });
  ui.rope = null;
  addObject(o);
}
function exactEntry() {
  const m = $('exact').value.split(',').map((s) => parseFloat(s));
  if (!ui.pending.length || !isFinite(m[0])) return;
  const ang = isFinite(m[1]) ? m[1] : 0;
  const base = ui.pending[ui.pending.length - 1];
  const p = V.add(base, V.mul(V.dir(toRad(ang)), m[0]));
  $('exact').value = '';
  ui.pending.push(p);
  const T = TOOLS[ui.tool];
  if (T.mode !== 'poly' && ui.pending.length >= NEED[T.mode]) { const o = T.make(ui.pending); ui.pending = []; addObject(o); }
  updateExactBox(); render();
}

/* =====================================================================
   11. MOUSE / KEYBOARD
   ===================================================================== */
function screenPt(e) { const r = $('svg').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

// Move an object by world displacement d. Anchored points stay attached to their targets.
function translate(o, d) {
  if (META[o.type].body) { o.x += d.x; o.y += d.y; }
  if (o.type === 'surface') o.pts = o.pts.map((p) => V.add(p, d));
  for (const k of META[o.type].pts || []) {
    const p = o[k];
    if (p && !p.ref) { p.x += d.x; p.y += d.y; }
  }
}

function initPointer() {
  const svg = $('svg');
  svg.addEventListener('contextmenu', (e) => e.preventDefault());
  svg.addEventListener('pointerdown', (e) => {
    const s = screenPt(e), w = W(s);
    if (e.button === 1 || e.button === 2 || ui.space) {
      ui.drag = { kind: 'pan', s0: s, ox: view.ox, oy: view.oy };
      svg.setPointerCapture(e.pointerId); return;
    }
    if (e.button !== 0) return;
    if (ui.tool === 'select') {
      const hEl = e.target.closest('[data-h]');
      if (hEl && !run.sim) { ui.drag = { kind: 'handle', h: ui.handles[+hEl.dataset.h], moved: false }; svg.setPointerCapture(e.pointerId); return; }
      const g = e.target.closest('[data-id]');
      if (g) {
        const id = g.dataset.id;
        if (e.shiftKey) { ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); }
        else if (!ui.sel.has(id)) ui.sel = new Set([id]);
        if (!run.sim) {                                // while simulating you can select but not move
          ui.drag = { kind: 'move', last: snapGridOnly(w), moved: false };
          svg.setPointerCapture(e.pointerId);
        }
      } else ui.sel.clear();
      render(); showPanel(); return;
    }
    if (run.sim) { msg('Reset the simulation (t = 0) to edit.'); return; }
    if (TOOLS[ui.tool].mode === 'drag') {              // initial-velocity tool: start dragging from a body
      const g = e.target.closest('[data-id]');
      const o = g && byId(g.dataset.id);
      if (o && META[o.type].body) {
        ui.sel = new Set([o.id]);
        ui.drag = { kind: 'vel', id: o.id, moved: false };
        svg.setPointerCapture(e.pointerId);
      } else msg('Start the drag on a body.');
      return;
    }
    toolClick(e, w);
  });
  svg.addEventListener('pointermove', (e) => {
    const s = screenPt(e), w = W(s);
    ui.mouseW = w;
    $('stPos').textContent = `x = ${w.x.toFixed(2)} m, y = ${w.y.toFixed(2)} m`;
    const d = ui.drag;
    if (d && d.kind === 'pan') { view.ox = d.ox + s.x - d.s0.x; view.oy = d.oy + s.y - d.s0.y; render(); return; }
    if (d && d.kind === 'move') {
      const now = snapGridOnly(w), delta = V.sub(now, d.last);
      if (delta.x || delta.y) { for (const id of ui.sel) translate(byId(id), delta); d.last = now; d.moved = true; render(); }
      return;
    }
    if (d && d.kind === 'handle') {
      const o = byId(d.h.id);
      const p = d.h.key === 'rot' ? w : snapPoint(w, e, new Set([o.id]));
      setHandle(o, d.h.key, p, e); d.moved = true; render(); return;
    }
    if (d && d.kind === 'vel') {                       // v0 = (drag vector) / V0_SCALE
      const o = byId(d.id);
      let v = V.mul(V.sub(w, o), 1 / V0_SCALE);
      if (e.shiftKey) { const a = toRad(Math.round(toDeg(Math.atan2(v.y, v.x)) / 15) * 15); v = V.mul(V.dir(a), V.len(v)); }
      o.vx = Math.round(v.x * 100) / 100; o.vy = Math.round(v.y * 100) / 100;
      d.moved = true; render(); return;
    }
    ui.snap = (ui.tool === 'select' || TOOLS[ui.tool].mode === 'drag') ? null : snapPoint(w, e);
    if (ui.tool !== 'select') render();
  });
  svg.addEventListener('pointerup', () => {
    const d = ui.drag; ui.drag = null;
    if (d && d.moved) { commit(); showPanel(); }
  });
  svg.addEventListener('dblclick', () => { if (TOOLS[ui.tool].mode === 'poly') finishPoly(); });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const s = screenPt(e), w = W(s);
    view.zoom = Math.min(20, Math.max(0.1, view.zoom * Math.pow(1.0015, -e.deltaY)));
    view.ox = s.x - w.x * view.ppm; view.oy = s.y + w.y * view.ppm;   // keep the point under the cursor fixed
    render();
  }, { passive: false });
}
function snapGridOnly(w) {
  if (!scene.settings.snapGrid) return w;
  const g = scene.settings.grid; return { x: Math.round(w.x / g) * g, y: Math.round(w.y / g) * g };
}

function initKeys() {
  window.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.target === $('exact') && e.key === 'Enter') { exactEntry(); return; }
    if (typing) return;
    const ctrl = e.ctrlKey || e.metaKey;
    // While a simulation exists (t > 0), the scene is read-only: Reset first.
    const editKey = (ctrl && 'zyvd'.includes(e.key.toLowerCase())) || e.key === 'Delete' || e.key === 'Backspace' || (e.key === 'r' && ui.tool === 'select');
    if (run.sim && editKey) { msg('Reset the simulation (t = 0) to edit.'); return; }
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (ctrl && e.key.toLowerCase() === 'c') { copySel(); return; }
    if (ctrl && e.key.toLowerCase() === 'v') { paste(); return; }
    if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); copySel(); paste(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); return; }
    if (e.key === 'Escape') { if (ui.pending.length || ui.rope) { ui.pending = []; ui.rope = null; updateExactBox(); render(); } else setTool('select'); return; }
    if (e.key === 'Enter' && TOOLS[ui.tool].mode === 'poly') { finishPoly(); return; }
    if (e.key === ' ') { ui.space = true; e.preventDefault(); return; }
    if (e.key.toLowerCase() === 'f' && !ctrl && ui.tool === 'select' && !e.shiftKey) { fitView(); return; }
    if (e.key === 'r' && ui.tool === 'select' && ui.sel.size) {     // R rotates the selection 15 degrees
      for (const id of ui.sel) { const o = byId(id); if (META[o.type].rot) o.angle += toRad(e.shiftKey ? -15 : 15); }
      commit(); render(); showPanel(); return;
    }
    if (ctrl || e.altKey) return;
    for (const [t, T] of Object.entries(TOOLS)) if (T.key === e.key.toLowerCase() && !(ui.tool === 'select' && ['f', 'r'].includes(T.key))) { setTool(t); return; }
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ') ui.space = false; });
}

function fitView() {
  render();
  const g = $('sceneG');
  if (!scene.objects.length) return;
  const bb = g.getBBox(), svg = $('svg');
  const k = Math.min((svg.clientWidth - 80) / bb.width, (svg.clientHeight - 80) / bb.height);
  const w0 = W({ x: bb.x, y: bb.y + bb.height });
  view.zoom = Math.min(10, Math.max(0.1, view.zoom * k));
  const scaledW = bb.width * k, scaledH = bb.height * k;
  const left = (svg.clientWidth - scaledW) / 2, bottom = (svg.clientHeight + scaledH) / 2;
  view.ox = left - w0.x * view.ppm; view.oy = bottom + w0.y * view.ppm;
  render();
}

const hist = { stack: [], i: -1 };
function commit() {
  const s = JSON.stringify(scene);
  if (hist.stack[hist.i] === s) return;
  hist.stack.splice(hist.i + 1);
  hist.stack.push(s);
  if (hist.stack.length > 200) hist.stack.shift();
  hist.i = hist.stack.length - 1;
  try { localStorage.setItem('mechSandbox.autosave', s); } catch (e) { /* storage blocked: fine */ }
}
function restore(s) { scene = JSON.parse(s); ui.sel = new Set([...ui.sel].filter((id) => byId(id))); render(); showPanel(); }
function undo() { if (run.sim) return msg('Reset the simulation (t = 0) to edit.'); if (hist.i > 0) restore(hist.stack[--hist.i]); }
function redo() { if (run.sim) return msg('Reset the simulation (t = 0) to edit.'); if (hist.i < hist.stack.length - 1) restore(hist.stack[++hist.i]); }

let clipboard = null;

function paste() {
  if (!clipboard || run.sim) return;
  const objs = JSON.parse(clipboard), map = {};
  for (const o of objs) { map[o.id] = uid(); }
  const d = { x: 0.2, y: -0.2 };
  for (const o of objs) {
    o.id = map[o.id];
    // references to objects that were copied too now point at the copies
    for (const k of META[o.type].pts || []) { const p = o[k]; if (p && p.ref && map[p.ref]) p.ref = map[p.ref]; else if (p && p.ref) { /* keep attached to original */ } }
    if (o.via) o.via.forEach((v) => { if (map[v.id]) v.id = map[v.id]; });
    translate(o, d);
    scene.objects.push(o);
  }
  ui.sel = new Set(objs.map((o) => o.id));
  commit(); render(); showPanel();
}
function deleteSel() {
  if (!ui.sel.size || run.sim) return;
  for (const o of scene.objects) {          // anything attached to a deleted object stays where it is
    for (const k of META[o.type].pts || []) { const p = o[k]; if (p && p.ref && ui.sel.has(p.ref)) { const q = P(p); o[k] = { x: q.x, y: q.y }; } }

/* =====================================================================
   16. PHYSICS: BUILDING A PLANCK WORLD FROM THE SCENE
   The editor's scene (a list of dicts) is turned into Planck objects once,
   when you press Play. Each step, Planck moves the bodies and sync() copies
   the new positions back into the scene so the normal renderer draws them.

   What Planck (Box2D) does for us:  rigid bodies, gravity, contacts with
     friction and restitution, and rigid joints (pins, welds, rods, tracks).
   What we do ourselves:  springs, dampers, actuators, applied forces and
     moments (explicit forces, recomputed every substep), the static/kinetic
     friction switch, and ropes over pulleys (Section 17).
   ===================================================================== */
const SLIP_SPEED = 1e-3;        // m/s: contact sliding faster than this uses mu_k, slower uses mu_s
const OMEGA_DT_TARGET = 0.01;   // substep until omega*dt <= this (accuracy target for stiff springs)
const MAX_SUBSTEPS = 400;

const PIN_TOL = 0.02;           // m: how close a pin must be to a body to grab it
const NO_UD = { mu_s: 1, mu_k: 1, e: 0, stick: false, id: '?' };
// Box2D lets touching shapes overlap by linearSlop (default 5 mm) and wraps polygons and edges in a
// "skin" of 2 x linearSlop (1 cm). At textbook sizes that's visible in the numbers: a disk rolls on an
// effective radius 2.5 mm too small, and a block drawn flush on the floor hops 1.5 cm at t = 0.
// So: use a 1 mm slop, shrink polygons by their skin, and shift surfaces into their solid side.
const SLOP = 0.001;
if (window.planck) planck.Settings.linearSlop = SLOP;
const SKIN = 2 * SLOP;
// Shift a surface polyline by d toward its hatched (solid) side. Corners are mitered.
function offsetPolyline(pts, side, d) {
  const nrm = [];
  for (let i = 0; i < pts.length - 1; i++) { const u = V.unit(V.sub(pts[i + 1], pts[i])); nrm.push({ x: u.y * side, y: -u.x * side }); }
  return pts.map((p, i) => {
    const a = nrm[Math.max(0, i - 1)], b = nrm[Math.min(nrm.length - 1, i)];
    const m = V.unit(V.add(a, b)), c = Math.max(0.2, V.dot(m, b));
    return V.add(p, V.mul(m, d / c));
  });
}

// Moment of inertia about the body's center (kg m^2), from its shape, unless overridden.
function inertiaOf(o) {
  const ov = parseFloat(o.Iover);
  if (ov > 0) return ov;
  const m = +o.mass || 0;
  switch (o.type) {
    case 'block': case 'cart': return m * (o.w * o.w + o.h * o.h) / 12;         // rectangle
    case 'disk': case 'pulley':
      if (o.shape === 'hoop') return m * o.r * o.r;                              // thin ring
      if (o.shape === 'sphere') return 0.4 * m * o.r * o.r;                      // 2/5 m r^2
      return 0.5 * m * o.r * o.r;                                                // solid disk
    case 'rod': return m * o.len * o.len / 12;                                   // thin rod about its middle
    case 'pointmass': return 4e-5 * m;                                           // tiny but nonzero
  }
  return NaN;
}
// World point -> body-local coordinates (the inverse of L2W).
function W2L(o, p) {
  const c = Math.cos(o.angle || 0), s = Math.sin(o.angle || 0), dx = p.x - o.x, dy = p.y - o.y;
  return { x: c * dx + s * dy, y: -s * dx + c * dy };
}
const rodHalfThick = (o) => Math.max(0.005, o.width / 2 / scene.settings.pxPerM);
const pmRadius = (o) => (o.style === 'bob' ? o.size + 3 : o.size) / scene.settings.pxPerM;
const isMasslessRod = (o) => o.type === 'rod' && !(o.mass > 0) && !o.fixed;
// Is world point p on (or within tol of) body object o?
function containsPoint(o, p, tol = PIN_TOL) {
  const q = W2L(o, p);
  switch (o.type) {
    case 'block': return Math.abs(q.x) <= o.w / 2 + tol && Math.abs(q.y) <= o.h / 2 + tol;
    case 'cart': return Math.abs(q.x) <= o.w / 2 + tol && q.y <= o.h / 2 + tol && q.y >= -o.h / 2 - 2 * o.wheelR - tol;
    case 'disk': case 'pulley': return Math.hypot(q.x, q.y) <= o.r + tol;
    case 'rod': return Math.abs(q.x) <= o.len / 2 + tol && Math.abs(q.y) <= rodHalfThick(o) + tol;
    case 'pointmass': return Math.hypot(q.x, q.y) <= pmRadius(o) + tol;
  }

}
// If a point field is anchored to a body (directly, or through a pin/weld), which body?
function refBodyId(pt) {
  for (let hops = 0; pt && pt.ref && hops < 5; hops++) {
    const o = byId(pt.ref);
    if (!o) return null;
    if (META[o.type].body) return o.id;
    pt = o.p;                                              // a pin or weld: follow its own point
  }
  return null;
}
const v2 = (p) => new planck.Vec2(p.x, p.y);

class Sim {
  constructor() {
    if (!window.planck) throw new Error('Planck.js did not load (it needs internet the first time).');
    const st = scene.settings;
    this.dt = st.dt; this.t = 0; this.tMid = 0; this.steps = 0;
    this.velIters = st.velIters; this.posIters = st.posIters;
    this.warnings = [];
    // Box2D only bounces impacts faster than velocityThreshold (default 1 m/s). Lower it.
    planck.Settings.velocityThreshold = Math.max(1e-4, +st.restThreshold || 0);
    this.world = new planck.World({ gravity: new planck.Vec2(0, -st.g), allowSleep: false });
    this.ground = this.world.createBody();     // static body that holds every fixed surface
    this.recs = new Map();                     // scene id -> {o, body, m, I, ...}
    this.elements = [];                        // springs, dampers, actuators
    this.loads = [];                           // applied forces F(t) and moments M(t)
    this.torsions = [];                        // torsion springs at pins
    this.ropes = [];                           // RopeSegment joints
    this.rodLinks = [];                        // massless rods (for redrawing)
    this.stickQueue = []; this.stuck = new Set();
    this.buildSurfaces();
    this.buildBodies();
    this.glueFreePoints();
    this.buildJoints();
    this.buildElements();
    this.buildLoads();
    this.buildRopes();
    this.chooseSubsteps();
    this.listenContacts();

  }
  warn(t) { if (!this.warnings.includes(t)) this.warnings.push(t); }

  /* ---- Fixed surfaces: edges (2 points) or chains (polylines, arcs) on the ground body ---- */
  buildSurfaces() {
    for (const o of scene.objects) {
      if (o.type !== 'surface') continue;
      let pts = o.pts.filter((p, i, a) => i === 0 || V.dist(p, a[i - 1]) > 0.01);
      if (pts.length < 2) continue;
      // Resting contact sits at (skin - slop) from the edge line, so move the line that far into the solid.
      pts = offsetPolyline(pts, o.side || 1, SKIN - SLOP);
      const shape = pts.length === 2 ? new planck.Edge(v2(pts[0]), v2(pts[1])) : new planck.Chain(pts.map(v2), false);
      this.ground.createFixture(shape, { friction: o.mu_s, restitution: o.e, userData: { mu_s: o.mu_s, mu_k: o.mu_k, e: o.e, stick: false, id: 'ground' } });
    }
  }

  /* ---- Bodies ---- */
  buildBodies() {
    for (const o of scene.objects) {
      if (!META[o.type].body || isMasslessRod(o)) continue;
      // Pulleys: mass 0 = ideal (rope slides over it). A fixed ideal pulley is just part of the ground.
      // A massive pulley with a fixed axle is a spinning body pinned to the ground at its center.
      const ideal = o.type === 'pulley' && !(o.mass > 0);
      const isStatic = o.fixed && !(o.type === 'pulley' && o.mass > 0);
      const body = this.world.createBody({
        type: isStatic ? 'static' : 'dynamic',
        position: new planck.Vec2(o.x, o.y), angle: o.angle || 0,
        linearVelocity: new planck.Vec2(+o.vx || 0, +o.vy || 0), angularVelocity: +o.omega || 0,
      });
      const ud = { mu_s: o.mu_s, mu_k: o.mu_k, e: o.e, stick: o.stick, id: o.id };
      const fd = (u = ud) => ({ density: 0, friction: u.mu_s, restitution: u.e, userData: u, filterMaskBits: o.collide ? 0xffff : 0 });
      // Polygons get a skin of SKIN around them, so build them that much smaller than drawn.
      const box = (hw, hh) => new planck.Box(Math.max(SKIN, hw - SKIN), Math.max(SKIN, hh - SKIN));
      switch (o.type) {
        case 'block': body.createFixture(box(o.w / 2, o.h / 2), fd()); break;
        case 'cart': {
          // Phase 2 cart = "frictionless cart": the wheels touch the ground but have mu = 0.
          body.createFixture(box(o.w / 2, o.h / 2), fd());
          const wheel = { ...ud, mu_s: 0, mu_k: 0 };
          for (const sx of [-0.3, 0.3]) body.createFixture(new planck.Circle(new planck.Vec2(o.w * sx, -o.h / 2 - o.wheelR), o.wheelR), fd(wheel));
          break;
        }
        case 'disk': case 'pulley': body.createFixture(new planck.Circle(o.r), fd()); break;
        case 'rod': body.createFixture(box(o.len / 2, rodHalfThick(o)), fd()); break;
        case 'pointmass': body.createFixture(new planck.Circle(pmRadius(o)), fd()); break;
      }

        if (!(I > 0)) I = 0.5 * m * (o.r || 0.05) ** 2;
        // Center of mass at the body origin, I about that point.
        body.setMassData({ mass: m, center: new planck.Vec2(0, 0), I });

    const rank = (r) => (r.o.id === preferId ? 0 : r.body.isDynamic() ? 1 : 2);
    return out.sort((a, b) => rank(a) - rank(b));

  // Where a connector end (spring, rope, force...) attaches: a body and a point in that body's frame.
  attach(pt) {

    if (pt && pt.ref) {
      const o = byId(pt.ref);
      if (o && this.recs.has(o.id)) rec = this.recs.get(o.id);
      else if (o && (o.type === 'pin' || o.type === 'weld' || isMasslessRod(o))) rec = this.bodiesAt(p, refBodyId(pt))[0] || null;

  glueFreePoints() {
    for (const o of scene.objects) {
      if (!['pin', 'weld', 'force', 'moment'].includes(o.type) || !o.p || o.p.ref) continue;
      if (o.type === 'pin' && o.mount === 'ground') continue;
      const hit = this.bodiesAt(o.p).find((r) => r.body.isDynamic());
      if (!hit) continue;
      const l = W2L(hit.o, o.p);
      o.p = { ref: hit.o.id, a: '@', lx: l.x, ly: l.y, x: o.p.x, y: o.p.y };

  /* ---- Rigid joints (Box2D constraints) ---- */
  buildJoints() {
    for (const o of scene.objects) {
      if (o.type === 'pin' || o.type === 'weld') this.buildPin(o);
      else if (isMasslessRod(o)) this.buildMasslessRod(o);
      else if (o.type === 'track') this.buildTrack(o);

  }
  buildPin(o) {
    const p = P(o.p), list = this.bodiesAt(p, refBodyId(o.p));
    if (!list.some((r) => r.body.isDynamic())) return;
    const pairs = [];

      for (const r of list) if (r.body.isDynamic()) pairs.push([this.ground, r.body]);
    } else {
      for (const r of list.slice(1)) if (list[0].body.isDynamic() || r.body.isDynamic()) pairs.push([list[0].body, r.body]);

    for (const [A, B] of pairs) {
      const j = o.type === 'pin' ? new planck.RevoluteJoint({}, A, B, v2(p)) : new planck.WeldJoint({ frequencyHz: 0 }, A, B, v2(p));
      this.world.createJoint(j);

    // with frequencyHz = 0 (rigid, not springy). Each end grabs whatever body is there, or the ground.
    const pa = L2W(o, -o.len / 2, 0), pb = L2W(o, o.len / 2, 0);
    const end = (p) => { const r = this.bodiesAt(p)[0]; const body = r ? r.body : this.ground; return { body, local: body.getLocalPoint(v2(p)) }; };
    const ea = end(pa), eb = end(pb);
    if (ea.body === eb.body || (!ea.body.isDynamic() && !eb.body.isDynamic())) { this.warn(`Massless rod ${o.id} isn't connecting two things, so it does nothing.`); return; }
    this.world.createJoint(new planck.DistanceJoint({ frequencyHz: 0, dampingRatio: 0 }, ea.body, eb.body, v2(pa), v2(pb)));
    this.rodLinks.push({ o, ea, eb });

  buildTrack(o) {

    // prismatic joint (no rotation, the track ends are stops). With it, a wheel joint (free spin).

  /* ---- Explicit force elements: springs, dampers, actuators ---- */
  buildElements() {
    for (const o of scene.objects) {
      if (!['spring', 'damper', 'springdamper', 'actuator'].includes(o.type) || !o.a || !o.b) continue;
      const el = { o, A: this.attach(o.a), B: this.attach(o.b), T: 0 };
      if (!el.A.body.isDynamic() && !el.B.body.isDynamic()) continue;
      if (o.type === 'actuator') {
        try { el.law = Expr.compile(String(o.law), ['t', 'd', 'v']); } catch (err) { el.law = () => 0; this.warn(`Actuator ${o.id}: ${err.message} (using F = 0).`); }
      }

  }
  // Tension in an element (N). Positive = pulling its two ends together.
  //   spring:   T = k*delta            (nonlinear: k2*delta + k3*delta^3), delta = L - L0
  //   damper:   T = c*dL/dt            (resists the ends moving apart or together)

  tension(el, L, Ldot) {

    if (o.type === 'damper' || o.type === 'springdamper') T += o.c * Ldot;
    if (o.type === 'actuator') T -= el.law({ t: this.tMid, d, v: Ldot });
    return T;
  }
  applyElement(el) {

    const L = V.dist(pA, pB);
    if (L < 1e-9) return;
    const u = V.mul(V.sub(pB, pA), 1 / L);                      // unit vector A -> B
    const vA = A.getLinearVelocityFromLocalPoint(el.A.local), vB = B.getLinearVelocityFromLocalPoint(el.B.local);
    const Ldot = V.dot(V.sub(vB, vA), u);                       // rate of stretching
    const T = this.tension(el, L, Ldot);

    A.applyForce(new planck.Vec2(u.x * T, u.y * T), pA, true);

  /* ---- Applied forces F(t) and moments M(t) ---- */
  buildLoads() {

      try { law = Expr.compile(String(o.law), ['t']); } catch (err) { this.warn(`${META[o.type].name} ${o.id}: ${err.message} (using 0).`); continue; }

    const body = ld.at.body, mag = ld.law({ t: this.tMid });
    if (!isFinite(mag)) return;
    if (ld.o.type === 'moment') { body.applyTorque(mag, true); return; }
    // world frame: fixed direction. body frame: the direction turns with the body.
    const deg = ld.o.frame === 'body' ? ld.angle0 + toDeg(body.getAngle() - ld.theta0) : ld.o.angle;
    const d = V.dir(toRad(deg));
    body.applyForce(new planck.Vec2(d.x * mag, d.y * mag), body.getWorldPoint(ld.at.local), true);
  }
  applyTorsion(ts) {
    // Torsion spring at a pin: torque = -kappa * (relative angle - starting relative angle)
    const tau = -ts.k * (ts.B.getAngle() - ts.A.getAngle() - ts.rel0);
    ts.B.applyTorque(tau, true); ts.A.applyTorque(-tau, true);
  }

  /* ---- Ropes (the constraint itself is in Section 17) ---- */
  buildRopes() {
    for (const o of scene.objects) {
      if (o.type !== 'rope' || !o.a || !o.b) continue;
      const endA = this.attach(o.a), endB = this.attach(o.b);
      const nodes = [{ kind: 'end', body: endA.body, local: endA.local }];
      for (const v of o.via) {
        const q = byId(v.id), rec = this.recs.get(v.id);
        if (!q || !rec) continue;
        // "grip" = the rope can't slip (a real pulley or disk that turns); "slide" = ideal pulley.
        nodes.push({ kind: rec.body.isDynamic() && !rec.ideal ? 'grip' : 'slide', body: rec.body, R: q.r, s: v.s });
      }
      nodes.push({ kind: 'end', body: endB.body, local: endB.local });
      // Split the rope into separate segments at every no-slip pulley: the pulley's friction lets
      // the tension differ on its two sides, so each side is its own constraint.
      let start = 0, first = true;
      for (let i = 1; i < nodes.length; i++) {
        if (nodes[i].kind !== 'grip' && i !== nodes.length - 1) continue;
        const segNodes = nodes.slice(start, i + 1).map((nd) => ({ ...nd }));
        start = i;
        const bodies = [...new Set(segNodes.map((nd) => nd.body))].filter((b) => b.isDynamic());
        if (!bodies.length) continue;                            // rope between two fixed things: nothing to do
        const seg = new RopeSegment(this, segNodes, first ? +o.slack || 0 : 0);
        first = false;
        seg.ropeId = o.id;
        this.world.createJoint(seg);
        // A rope touches more than 2 bodies: tie the extras into the same island (see Section 17).
        for (const b of bodies.slice(2)) this.world.createJoint(new LinkJoint(bodies[0], b));
        this.ropes.push(seg);
      }
    }
  }

  /* ---- Substeps for stiff springs ----
     An explicit spring is only accurate when omega*dt is small. omega = sqrt(k / m_eff), where
     1/m_eff = (1/m_A + (r_A x u)^2 / I_A) + (same for B): how easily the two ends move along the spring. */
  invMassAlong(end, u) {
    const b = end.body;
    if (!b.isDynamic()) return 0;
    const r = V.sub(b.getWorldPoint(end.local), b.getWorldCenter());
    return b.m_invMass + b.m_invI * V.cross(r, u) ** 2;
  }
  chooseSubsteps() {
    let rate = 0;
    for (const el of this.elements) {
      const o = el.o, pA = el.A.body.getWorldPoint(el.A.local), pB = el.B.body.getWorldPoint(el.B.local);
      const u = V.unit(V.sub(pB, pA)), mInv = this.invMassAlong(el.A, u) + this.invMassAlong(el.B, u);
      if (o.type === 'spring' || o.type === 'springdamper') {
        const d = V.dist(pA, pB) - o.restLen;
        const k = o.nonlinear ? Math.abs(o.k2) + 3 * Math.abs(o.k3) * d * d : Math.abs(o.k);
        rate = Math.max(rate, Math.sqrt(k * mInv));
      }
      if (o.type === 'damper' || o.type === 'springdamper') rate = Math.max(rate, Math.abs(o.c) * mInv);
    }
    for (const ts of this.torsions) rate = Math.max(rate, Math.sqrt(ts.k * (ts.A.m_invI + ts.B.m_invI)));
    const need = Math.ceil(rate * this.dt / OMEGA_DT_TARGET);
    this.sub = Math.min(MAX_SUBSTEPS, Math.max(1, need));
    this.omegaDt = rate * this.dt / this.sub;
    if (need > MAX_SUBSTEPS) this.warn(`Too stiff: ω·Δt = ${this.omegaDt.toFixed(3)} even with ${MAX_SUBSTEPS} substeps. Use a smaller Δt, softer springs or heavier bodies.`);
  }

  /* ---- Contacts: static/kinetic friction switch, restitution, stick on contact ---- */
  listenContacts() {
    const wm = new planck.WorldManifold();
    // pre-solve runs for every touching contact, every step, before Box2D solves it.
    this.world.on('pre-solve', (contact) => {
      const fA = contact.getFixtureA(), fB = contact.getFixtureB();
      const a = fA.getUserData() || NO_UD, b = fB.getUserData() || NO_UD;
      const bA = fA.getBody(), bB = fB.getBody();
      contact.getWorldManifold(wm);
      const t = { x: -wm.normal.y, y: wm.normal.x };            // tangent direction
      let slip = 0;
      for (let i = 0; i < contact.getManifold().pointCount; i++) {
        const p = wm.points[i];
        const rel = V.sub(bB.getLinearVelocityFromWorldPoint(p), bA.getLinearVelocityFromWorldPoint(p));
        slip = Math.max(slip, Math.abs(V.dot(rel, t)));
      }
      // Box2D has one friction coefficient, so pick mu_s or mu_k each step from the sliding speed.
      contact.setFriction(slip > SLIP_SPEED ? Math.min(a.mu_k, b.mu_k) : Math.min(a.mu_s, b.mu_s));
      contact.setRestitution(a.stick || b.stick ? 0 : Math.max(a.e, b.e));
    });
    // Stick on contact: remember the pair now (the world is locked during callbacks), weld after the step.
    this.world.on('begin-contact', (contact) => {
      const fA = contact.getFixtureA(), fB = contact.getFixtureB();
      const a = fA.getUserData() || NO_UD, b = fB.getUserData() || NO_UD;
      if (!(a.stick || b.stick)) return;
      const key = [a.id, b.id].sort().join('|');
      if (this.stuck.has(key)) return;
      this.stuck.add(key);
      contact.getWorldManifold(wm);
      const p = contact.getManifold().pointCount ? { x: wm.points[0].x, y: wm.points[0].y } : V.mul(V.add(fA.getBody().getPosition(), fB.getBody().getPosition()), 0.5);
      this.stickQueue.push({ A: fA.getBody(), B: fB.getBody(), p });
    });
  }
  flushStick() {
    for (const s of this.stickQueue) this.world.createJoint(new planck.WeldJoint({ frequencyHz: 0 }, s.A, s.B, v2(s.p)));
    this.stickQueue = [];
  }

  /* ---- The physics loop: one fixed time step dt, split into `sub` equal substeps ---- */
  step() {
    const h = this.dt / this.sub;
    for (let i = 0; i < this.sub; i++) {
      // 1. Explicit forces from the current positions and velocities (Box2D clears them after each step).
      //    Time-varying laws F(t) are read at the middle of the substep (exact for F = a + b t).
      this.tMid = this.t + h / 2;
      for (const el of this.elements) this.applyElement(el);
      for (const ld of this.loads) this.applyLoad(ld);
      for (const ts of this.torsions) this.applyTorsion(ts);
      // 2. Box2D: add gravity + forces to velocities, solve joints/contacts/ropes, move the bodies.
      this.world.step(h, this.velIters, this.posIters);
      this.t += h;
      // 3. Joints that had to wait until the world was unlocked.
      if (this.stickQueue.length) this.flushStick();
    }
    this.steps++;
    this.t = this.steps * this.dt;                               // avoid round-off build-up
  }

  // Copy body positions back into the scene so the normal renderer draws the moving system.
  sync() {
    for (const r of this.recs.values()) {
      const p = r.body.getPosition();
      r.o.x = p.x; r.o.y = p.y; r.o.angle = r.body.getAngle();
    }
    for (const rl of this.rodLinks) Object.assign(rl.o, rodGeom(rl.ea.body.getWorldPoint(rl.ea.local), rl.eb.body.getWorldPoint(rl.eb.local)));
    for (const ld of this.loads) if (ld.o.type === 'force' && ld.o.frame === 'body') ld.o.angle = ld.angle0 + toDeg(ld.at.body.getAngle() - ld.theta0);
  }

  // Mechanical energy (J). U_g is measured from y = 0.
  energy() {
    const g = scene.settings.g;
    let K = 0, Kr = 0, Ug = 0, Us = 0;
    for (const r of this.recs.values()) {
      if (!r.body.isDynamic()) continue;
      const v = r.body.getLinearVelocity(), w = r.body.getAngularVelocity();
      K += 0.5 * r.m * (v.x * v.x + v.y * v.y);
      Kr += 0.5 * r.I * w * w;
      Ug += r.m * g * r.body.getPosition().y;
    }
    for (const el of this.elements) {
      const o = el.o;
      if (o.type !== 'spring' && o.type !== 'springdamper') continue;
      const d = V.dist(el.A.body.getWorldPoint(el.A.local), el.B.body.getWorldPoint(el.B.local)) - o.restLen;
      Us += o.nonlinear ? 0.5 * o.k2 * d * d + 0.25 * o.k3 * d ** 4 : 0.5 * o.k * d * d;
    }
    for (const ts of this.torsions) { const d = ts.B.getAngle() - ts.A.getAngle() - ts.rel0; Us += 0.5 * ts.k * d * d; }
    return { K, Kr, Ug, Us, total: K + Kr + Ug + Us };
  }
}

/* =====================================================================
   17. PHYSICS: CUSTOM ROPE CONSTRAINT (ropes over pulleys)
   Box2D has no rope-over-pulley joint, so we write one. A rope segment
   is a list of nodes: an end, any number of ideal pulleys, another end.
   (A no-slip pulley always ends one segment and starts the next.)

   The rule: the rope's length along its path can't exceed its rest
   length. It can go slack (shorter), but never stretch: tension only.

   Like every Box2D joint we provide three functions the solver calls:
     initVelocityConstraints   once per step: geometry + Jacobian
     solveVelocityConstraints  many times: fix velocities so dL/dt <= 0 when taut
     solvePositionConstraints  a few times: remove any stretch that crept in

   The Jacobian J says how the rope length changes when the bodies move:
     dL/dt = sum over bodies of (Jv . v + Jw * omega)
   Each node contributes Jv = -E and Jw = -(r x E), where E is the sum of
   unit vectors pointing from the node's contact point along its spans,
   and r runs from the body's center to that contact point. Pulling a
   node along E shortens the rope, which is why the signs are negative.
   ===================================================================== */
const wrapPi = (a) => a - TAU * Math.floor((a + Math.PI) / TAU);   // into [-pi, pi)
// Body pose: during a solve Box2D keeps the moving bodies' working positions in c_position.
const poseOf = (body, inSolver) => (inSolver && body.isDynamic() ? body.c_position : body.m_sweep);
const posePt = (ps, l) => { const c = Math.cos(ps.a), s = Math.sin(ps.a); return { x: ps.c.x + c * l.x - s * l.y, y: ps.c.y + s * l.x + c * l.y }; };

// If the Planck script failed to load, keep the editor working (Play will explain the problem).
const JointBase = window.planck ? planck.Joint : class {};
class RopeSegment extends JointBase {
  constructor(sim, nodes, slack) {
    const dyn = [...new Set(nodes.map((nd) => nd.body))].filter((b) => b.isDynamic());
    // bodyA / bodyB only matter for Box2D's island search; LinkJoints cover any extra bodies.
    super({ collideConnected: true }, dyn[0], dyn[1] || sim.ground);
    this.m_type = 'rope-segment';
    this.nodes = nodes;
    this.acc = 0;             // accumulated impulse (N s), <= 0: negative means the rope pulls
    this.invDt = 0;
    this.J = []; this.mass = 0; this.L = 0;
    // No-slip pulley at either end: track the tangent point angle phi and the pulley angle theta.
    nodes.forEach((nd, i) => {
      if (nd.kind !== 'grip') return;
      nd.role = i === 0 ? 1 : -1;              // +1 = rope leaves this pulley, -1 = arrives at it
      nd.phi = this.contactAngle(nd, i, false);
      nd.phi0 = nd.phi;
      nd.theta0 = nd.body.getAngle();
    });
    this.Lrest = this.geom(false, false).L + slack;
  }
  contactAngle(nd, i, inSolver) {
    const g = this.spans(inSolver);
    const c = g.C[i], p = i === 0 ? g.spans[0].p1 : g.spans[i - 1].p2;
    return Math.atan2(p.y - c.y, p.x - c.x);
  }
  // Node centers and the straight spans between them (tangent lines, same math as the drawing).
  spans(inSolver) {
    const C = [], Rs = [], poses = [];
    for (const nd of this.nodes) {
      const ps = poseOf(nd.body, inSolver);
      poses.push(ps);
      if (nd.kind === 'end') { C.push(posePt(ps, nd.local)); Rs.push(0); }
      else { C.push({ x: ps.c.x, y: ps.c.y }); Rs.push(nd.R * nd.s); }
    }
    const spans = [];
    for (let i = 0; i < C.length - 1; i++) spans.push(tangent(C[i], Rs[i], C[i + 1], Rs[i + 1]));
    return { C, poses, spans };
  }
  // Rope length L and Jacobian J (one entry per moving body).
  geom(inSolver, commit) {
    const { C, poses, spans } = this.spans(inSolver), n = this.nodes.length;
    let L = 0;
    for (const sp of spans) L += V.dist(sp.p1, sp.p2);
    const J = new Map();
    const addJ = (body, E, r) => {
      if (!body.isDynamic()) return;
      if (!J.has(body)) J.set(body, { body, x: 0, y: 0, w: 0 });
      const j = J.get(body);
      j.x -= E.x; j.y -= E.y; j.w -= V.cross(r, E);
    };
    this.nodes.forEach((nd, i) => {
      const eIn = i > 0 ? V.unit(V.sub(spans[i - 1].p1, spans[i - 1].p2)) : null;      // back along the previous span
      const eOut = i < n - 1 ? V.unit(V.sub(spans[i].p2, spans[i].p1)) : null;         // forward along the next span
      const ctr = poses[i].c;
      if (nd.kind === 'end') {
        addJ(nd.body, eOut || eIn, V.sub(C[i], ctr));
      } else if (nd.kind === 'slide') {
        // Ideal pulley: the rope slides, so only the pulley's center matters (r = 0, no torque).
        addJ(nd.body, V.add(eIn, eOut), { x: 0, y: 0 });
        const pin = spans[i - 1].p2, pout = spans[i].p1;
        const aIn = Math.atan2(pin.y - C[i].y, pin.x - C[i].x), aOut = Math.atan2(pout.y - C[i].y, pout.x - C[i].x);
        L += nd.R * mod(nd.s * (aOut - aIn), TAU);                                    // rope wrapped on the pulley
      } else {
        // No-slip pulley: the rope moves with the pulley's rim. The wrapped length counted in this
        // segment changes when the tangent point moves (phi) and when the pulley turns (theta).
        const p = i === 0 ? spans[0].p1 : spans[i - 1].p2;
        addJ(nd.body, i === 0 ? eOut : eIn, V.sub(p, C[i]));
        const phi = nd.phi + wrapPi(Math.atan2(p.y - C[i].y, p.x - C[i].x) - nd.phi);  // unwrapped angle
        if (commit) nd.phi = phi;
        L += nd.role * nd.R * nd.s * ((phi - nd.phi0) - (poses[i].a - nd.theta0));
      }
    });
    return { L, J: [...J.values()] };
  }
  effMass(J) {
    let k = 0;
    for (const j of J) k += j.body.m_invMass * (j.x * j.x + j.y * j.y) + j.body.m_invI * j.w * j.w;
    return k > 0 ? 1 / k : 0;
  }
  applyImpulse(lam) {
    for (const j of this.J) {
      const b = j.body, v = b.c_velocity;
      v.v.x += b.m_invMass * j.x * lam; v.v.y += b.m_invMass * j.y * lam; v.w += b.m_invI * j.w * lam;
    }
  }
  initVelocityConstraints(step) {
    const g = this.geom(true, true);
    this.L = g.L; this.J = g.J; this.mass = this.effMass(g.J); this.invDt = step.inv_dt;
    if (step.warmStarting) { this.acc *= step.dtRatio; this.applyImpulse(this.acc); } else this.acc = 0;
  }
  solveVelocityConstraints(step) {
    let Cdot = 0;
    for (const j of this.J) { const v = j.body.c_velocity; Cdot += j.x * v.v.x + j.y * v.v.y + j.w * v.w; }
    const C = this.L - this.Lrest;
    if (C < 0) Cdot += step.inv_dt * C;             // slack: allow the gap to close, but not overshoot
    const old = this.acc;
    this.acc = Math.min(0, old - this.mass * Cdot); // tension only: impulse can never push
    this.applyImpulse(this.acc - old);
  }
  solvePositionConstraints(step) {
    const g = this.geom(true, false);
    const C = g.L - this.Lrest;
    const mass = this.effMass(g.J);
    const lam = -mass * Math.min(Math.max(C, 0), planck.Settings.maxLinearCorrection);
    for (const j of g.J) {
      const b = j.body, p = b.c_position;
      p.c.x += b.m_invMass * j.x * lam; p.c.y += b.m_invMass * j.y * lam; p.a += b.m_invI * j.w * lam;
    }
    return C < planck.Settings.linearSlop;
  }
  get tension() { return -this.acc * this.invDt; }   // N
  getAnchorA() { return this.m_bodyA.getPosition(); }
  getAnchorB() { return this.m_bodyB.getPosition(); }
  getReactionForce() { return new planck.Vec2(0, 0); }
  getReactionTorque() { return 0; }
}
// A joint that does nothing. Box2D only solves bodies together if a joint or contact links them,
// so these tie every body a rope touches into the rope's island.
class LinkJoint extends JointBase {
  constructor(A, B) { super({ collideConnected: true }, A, B); this.m_type = 'link'; }
  initVelocityConstraints() {}
  solveVelocityConstraints() {}
  solvePositionConstraints() { return true; }
  getAnchorA() { return this.m_bodyA.getPosition(); }
  getAnchorB() { return this.m_bodyB.getPosition(); }
  getReactionForce() { return new planck.Vec2(0, 0); }
  getReactionTorque() { return 0; }
}

/* =====================================================================
   18. SIMULATION CONTROLS (play / pause / step / reset)
   Play saves a JSON snapshot of the scene; Reset restores it, so the
   same run replays exactly. The physics always advances in whole steps
   of dt no matter the frame rate (an "accumulator" collects real time).
   ===================================================================== */
const run = { sim: null, snapshot: null, playing: false, acc: 0, speed: 1, last: 0, slow: false, panelAt: 0 };
const FRAME_BUDGET_MS = 14;

function startSim() {
  if (run.sim) return true;
  run.snapshot = JSON.stringify(scene);
  try { run.sim = new Sim(); }
  catch (err) {
    console.error(err);
    scene = JSON.parse(run.snapshot); run.sim = null; run.snapshot = null;
    msg('Could not start the simulation: ' + err.message);
    return false;
  }
  if (ui.tool !== 'select') setTool('select');
  ui.pending = []; ui.rope = null;
  run.sim.sync(); render(); showPanel();
  return true;
}
function playPause() {
  if (!run.sim && !startSim()) return;
  run.playing = !run.playing; run.acc = 0; run.slow = false;
  updateSimUI();
}
function stepOnce() {
  if (!run.sim && !startSim()) return;
  run.playing = false;
  run.sim.step(); run.sim.sync(); render(); showPanel(); updateSimUI();
}
function resetSim() {
  if (!run.snapshot) return;
  scene = JSON.parse(run.snapshot);
  endSim();
  ui.sel = new Set([...ui.sel].filter((id) => byId(id)));
  render(); showPanel();
}
// Forget the simulation without restoring anything (used before New / Open / Examples).
function endSim() {
  run.sim = null; run.snapshot = null; run.playing = false; run.acc = 0; run.slow = false;
  updateSimUI();
}
function updateSimUI() {
  $('bPlay').textContent = run.playing ? '❚❚ Pause' : '▶ Play';
  $('tRead').textContent = `t = ${(run.sim ? run.sim.t : 0).toFixed(3)} s`;
  const w = run.sim ? [...run.sim.warnings] : [];
  if (run.sim && run.sim.sub > 1) w.unshift(`${run.sim.sub} substeps/step`);
  if (run.slow) w.push('slower than real time');
  $('simWarn').textContent = w.join(' · ');
  $('simWarn').title = w.join('\n');
}
function frame(now) {
  const real = Math.min(0.1, Math.max(0, (now - run.last) / 1000));   // seconds since last frame (capped)
  run.last = now;
  if (run.playing && run.sim) {
    run.acc += real * run.speed;
    const t0 = performance.now();
    let n = 0;
    run.slow = false;
    while (run.acc >= run.sim.dt) {
      // Out of time this frame: drop the leftover so the sim runs slower instead of changing its steps.
      if (performance.now() - t0 > FRAME_BUDGET_MS) { run.acc = 0; run.slow = true; break; }
      run.sim.step(); run.acc -= run.sim.dt; n++;
    }
    if (n) { run.sim.sync(); render(); }
    // Keep the (read-only) properties panel showing current values, 4 times a second.
    if (n && ui.sel.size === 1 && now - run.panelAt > 250) { run.panelAt = now; showPanel(); }
    updateSimUI();
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   19. BUILT-IN TESTS
   Each test builds its own little scene, runs it with the same Sim class
   the editor uses, and compares a measurement with the textbook answer.
   ===================================================================== */
function testScene(build, g = 9.81) {
  const sc = newScene();
  sc.settings.g = g;
  const add = (type, props) => { const o = mk(type, props); o.id = 'o' + (sc.nextId++); sc.objects.push(o); return o; };
  const R = (o, a) => ({ ref: o.id, a, x: 0, y: 0 });
  build(add, R);
  return sc;
}
// Run fn with `sc` as the global scene (P(), byId() etc. read the global), then put the editor's scene back.
function withScene(sc, fn) {
  const saved = scene;
  scene = sc;
  try { return fn(); } finally { scene = saved; }
}
function simulate(sc, T, sample) {
  return withScene(sc, () => {
    const sim = new Sim();
    const n = Math.round(T / sim.dt);
    for (let i = 0; i < n; i++) { sim.step(); if (sample) sample(sim); }
    return sim;
  });
}
// Period from zero crossings of a velocity: two crossings per period, interpolated linearly.
function periodFromCrossings(ts, vs) {
  const cross = [];
  for (let i = 1; i < vs.length; i++) if ((vs[i - 1] < 0) !== (vs[i] < 0)) cross.push(ts[i - 1] + (0 - vs[i - 1]) * (ts[i] - ts[i - 1]) / (vs[i] - vs[i - 1]));
  return cross.length < 3 ? NaN : 2 * (cross[cross.length - 1] - cross[0]) / (cross.length - 1);
}
const relErr = (a, b) => Math.abs(a - b) / Math.abs(b);
const recOf = (sim, o) => sim.recs.get(o.id).body;

// Shared setups
function springMassScene() {
  // Block on frictionless ground, spring from a wall at x = -1. Rest: block center at x = 0. Start: x = 0.1.
  return testScene((add, R) => {
    add('surface', { kind: 'line', pts: [{ x: -2, y: 0 }, { x: 3, y: 0 }], mu_s: 0, mu_k: 0 });
    const b = add('block', { x: 0.1, y: 0.2, w: 0.4, h: 0.4, mass: 1 });
    add('spring', { a: free(-1, 0.2), b: R(b, 'l'), k: 100, restLen: 0.8 });
  });
}
const INC = toRad(30), INC_U = { x: Math.cos(INC), y: Math.sin(INC) }, INC_N = { x: -Math.sin(INC), y: Math.cos(INC) };
const onIncline = (s, h) => V.add(V.mul(INC_U, s), V.mul(INC_N, h));   // s along the slope, h above it
function inclineScene(mu_s, mu_k, addBody) {
  return testScene((add) => {
    add('surface', { kind: 'line', pts: [{ x: 0, y: 0 }, V.mul(INC_U, 7)], mu_s, mu_k });
    addBody(add);
  });
}
function atwoodScene(pulleyMass) {
  return testScene((add, R) => {
    const p = add('pulley', { x: 0, y: 3, r: 0.2, mass: pulleyMass, shape: 'solid disk', fixed: true });
    const b1 = add('block', { x: -0.2, y: 1.5, w: 0.2, h: 0.2, mass: 2 });
    const b2 = add('block', { x: 0.2, y: 1.5, w: 0.2, h: 0.2, mass: 3 });
    add('rope', { a: R(b1, 't'), b: R(b2, 't'), via: [{ id: p.id, s: -1 }] });   // s = -1: over the top
  });
}

const TESTS = [
  { name: 'Spring-mass, m = 1 kg, k = 100 N/m: period', run() {
    const sc = springMassScene(), ts = [], vs = [];
    let b;
    simulate(sc, 3, (sim) => { b = b || recOf(sim, sc.objects[1]); ts.push(sim.t); vs.push(b.getLinearVelocity().x); });
    const T = periodFromCrossings(ts, vs), want = TAU / 10;
    return { meas: T.toFixed(4) + ' s', exp: want.toFixed(4) + ' s ±1%', pass: relErr(T, want) <= 0.01 };
  } },
  { name: 'Simple pendulum, L = 1 m, 5°: period', run() {
    const th = toRad(5);
    const sc = testScene((add) => {
      add('pin', { p: free(0, 2), mount: 'ground', mountAngle: 90 });
      add('rod', { ...rodGeom({ x: 0, y: 2 }, { x: Math.sin(th), y: 2 - Math.cos(th) }), mass: 0 });
      add('pointmass', { x: Math.sin(th), y: 2 - Math.cos(th), mass: 1 });
    });
    const ts = [], vs = [];
    let b;
    simulate(sc, 7, (sim) => { b = b || recOf(sim, sc.objects[2]); ts.push(sim.t); vs.push(b.getLinearVelocity().x); });
    const T = periodFromCrossings(ts, vs), want = 2.006;
    return { meas: T.toFixed(4) + ' s', exp: '2.006 s ±1%', pass: relErr(T, want) <= 0.01 };
  } },
  { name: '30° incline, μs = 0.5, μk = 0.3: slides', run() {
    const sc = inclineScene(0.5, 0.3, (add) => add('block', { ...onIncline(6, 0.2), w: 0.4, h: 0.4, angle: INC, mass: 1 }));
    let b, v05 = 0, v15 = 0;
    simulate(sc, 1.5, (sim) => {
      b = b || recOf(sim, sc.objects[1]);
      const v = -V.dot(b.getLinearVelocity(), INC_U);             // speed down the slope
      if (sim.steps === Math.round(0.5 / sim.dt)) v05 = v;
      v15 = v;
    });
    const a = v15 - v05, want = 9.81 * (Math.sin(INC) - 0.3 * Math.cos(INC));
    return { meas: 'a = ' + a.toFixed(4) + ' m/s²', exp: want.toFixed(3) + ' m/s² ±1%', pass: relErr(a, want) <= 0.01 };
  } },
  { name: '30° incline, μs = 0.6: stays put', run() {
    const sc = inclineScene(0.6, 0.3, (add) => add('block', { ...onIncline(6, 0.2), w: 0.4, h: 0.4, angle: INC, mass: 1 }));
    let b, p0 = null, p1 = null;
    simulate(sc, 2, (sim) => { b = b || recOf(sim, sc.objects[1]); const p = b.getPosition(); p1 = { x: p.x, y: p.y }; if (!p0) p0 = p1; });
    const d = Math.abs(V.dot(V.sub(p1, p0), INC_U));
    return { meas: 'moved ' + (d * 1000).toFixed(3) + ' mm in 2 s', exp: '< 1 mm', pass: d < 1e-3 };
  } },
  { name: 'Atwood 2 kg + 3 kg, massless pulley', run() {
    const sc = atwoodScene(0);
    let b, v05 = 0, v1 = 0;
    simulate(sc, 1, (sim) => { b = b || recOf(sim, sc.objects[2]); const v = -b.getLinearVelocity().y; if (sim.steps === Math.round(0.5 / sim.dt)) v05 = v; v1 = v; });
    const a = (v1 - v05) / 0.5, want = 9.81 / 5;
    return { meas: 'a = ' + a.toFixed(4) + ' m/s²', exp: want.toFixed(3) + ' m/s² ±1%', pass: relErr(a, want) <= 0.01 };
  } },
  { name: 'Atwood with 2 kg solid-disk pulley (no slip)', run() {
    const sc = atwoodScene(2);
    let b, v05 = 0, v1 = 0;
    simulate(sc, 1, (sim) => { b = b || recOf(sim, sc.objects[2]); const v = -b.getLinearVelocity().y; if (sim.steps === Math.round(0.5 / sim.dt)) v05 = v; v1 = v; });
    const a = (v1 - v05) / 0.5, want = 9.81 / 6;      // (m2 - m1) g / (m1 + m2 + I/r^2), I/r^2 = 1 kg
    return { meas: 'a = ' + a.toFixed(4) + ' m/s²', exp: want.toFixed(3) + ' m/s² ±1%', pass: relErr(a, want) <= 0.01 };
  } },
  { name: 'Solid disk rolling down 30°, μs = 0.5', run() {
    const sc = inclineScene(0.5, 0.3, (add) => add('disk', { ...onIncline(6, 0.2), r: 0.2, mass: 1, shape: 'solid disk' }));
    let b, v05 = 0, v15 = 0, slip = 0;
    simulate(sc, 1.5, (sim) => {
      b = b || recOf(sim, sc.objects[1]);
      const v = b.getLinearVelocity(), w = b.getAngularVelocity(), sp = -V.dot(v, INC_U);
      if (sim.steps === Math.round(0.5 / sim.dt)) v05 = sp;
      v15 = sp;
      // Velocity of the contact point = v_cm + omega x r (r from center to contact = -0.2 n). Zero if rolling.
      const r = V.mul(INC_N, -0.2), vc = { x: v.x - w * r.y, y: v.y + w * r.x };
      if (sim.t >= 0.25) slip = Math.max(slip, V.len(vc) / Math.abs(sp));
    });
    const a = v15 - v05, want = (2 / 3) * 9.81 * Math.sin(INC);
    return { meas: `a = ${a.toFixed(4)} m/s², max |v − ωR|/v = ${(slip * 100).toFixed(3)}%`, exp: want.toFixed(3) + ' m/s² ±1%, v = ωR', pass: relErr(a, want) <= 0.01 && slip < 0.01 };
  } },
  { name: '1D elastic collision, 1 kg at 2 m/s into 1 kg', run() {
    const sc = testScene((add) => {
      add('disk', { x: 0, y: 1, r: 0.1, mass: 1, e: 1, vx: 2 });
      add('disk', { x: 1, y: 1, r: 0.1, mass: 1, e: 1 });
    }, 0);
    const sim = simulate(sc, 1);
    const v1 = recOf(sim, sc.objects[0]).getLinearVelocity().x, v2 = recOf(sim, sc.objects[1]).getLinearVelocity().x;
    const p = v1 + v2, K = 0.5 * v1 * v1 + 0.5 * v2 * v2;
    const pass = Math.abs(v1) < 0.01 && relErr(v2, 2) <= 0.005 && relErr(p, 2) <= 0.005 && relErr(K, 2) <= 0.005;
    return { meas: `v₁ = ${v1.toFixed(4)}, v₂ = ${v2.toFixed(4)} m/s; p = ${p.toFixed(4)}, K = ${K.toFixed(4)}`, exp: 'v₁ = 0, v₂ = 2; p = 2 kg·m/s, K = 2 J (±0.5%)', pass };
  } },
  { name: 'Frictionless spring-mass: energy over 10 s', run() {
    const sc = springMassScene(), E = [], ts = [];
    let Ug0;
    simulate(sc, 10, (sim) => {
      const e = sim.energy();
      if (Ug0 === undefined) Ug0 = sim.Ug0;
      E.push(e.K + e.Kr + e.Us + (e.Ug - Ug0)); ts.push(sim.t);   // oscillation energy (U_g measured from the start)
    });
    const E0 = 0.5 * 100 * 0.1 * 0.1;                               // = 0.5 J
    const maxDev = Math.max(...E.map((e) => Math.abs(e - E0))) / E0;
    const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const drift = (mean(E.filter((e, i) => ts[i] > 9)) - mean(E.filter((e, i) => ts[i] <= 1))) / E0;
    return { meas: `max |E − E₀|/E₀ = ${(maxDev * 100).toFixed(3)}%, drift = ${(drift * 100).toFixed(3)}%`, exp: '≤ 1%, drift ≈ 0 (< 0.2%)', pass: maxDev <= 0.01 && Math.abs(drift) < 0.002 };
  } },
];

async function runTests() {
  if (run.playing) { run.playing = false; updateSimUI(); }
  $('testBox').hidden = false;
  const rows = $('testRows');
  rows.innerHTML = TESTS.map((T, i) => `<tr><td>${i + 1}</td><td>${esc(T.name)}</td><td id="tm${i}">…</td><td id="te${i}"></td><td id="tr${i}"></td></tr>`).join('');
  $('testSummary').textContent = 'Running…';
  let passed = 0;
  for (let i = 0; i < TESTS.length; i++) {
    await new Promise((r) => setTimeout(r, 20));                 // let the table repaint between tests
    let res;
    const t0 = performance.now();
    try { res = TESTS[i].run(); } catch (err) { console.error(err); res = { meas: 'error: ' + err.message, exp: '', pass: false }; }
    $('tm' + i).textContent = res.meas;
    $('te' + i).textContent = res.exp;
    $('tr' + i).innerHTML = `<span class="${res.pass ? 'pass' : 'fail'}">${res.pass ? 'PASS' : 'FAIL'}</span> <span class="note">${Math.round(performance.now() - t0)} ms</span>`;
    if (res.pass) passed++;
  }
  $('testSummary').textContent = `${passed} of ${TESTS.length} passed.`;
  return passed;
}

/* =====================================================================
   20. STARTUP
   ===================================================================== */
function buildToolbar() {
  let h = '', group = '';
  for (const [t, T] of Object.entries(TOOLS)) {
    if (T.group !== group) { group = T.group; h += `<h4>${group}</h4>`; }
    h += `<button data-tool="${t}" title="${T.key ? 'Shortcut: ' + T.key.toUpperCase() : ''}">${T.name}</button>`;
  }
  $('tools').innerHTML = h;
  $('tools').querySelectorAll('button').forEach((b) => b.onclick = () => setTool(b.dataset.tool));
}
function init() {
  buildToolbar();
  initPointer(); initKeys();
  $('bNew').onclick = () => { endSim(); scene = newScene(); ui.sel.clear(); commit(); render(); showPanel(); };
  $('bOpen').onclick = () => $('fileIn').click();
  $('fileIn').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    file.text().then((t) => { try { loadSceneObject(JSON.parse(t)); } catch (err) { msg('Could not read file: ' + err.message); } });
    e.target.value = '';
  };
  $('bSave').onclick = () => download('scene.json', JSON.stringify(scene, null, 1), 'application/json');
  $('examples').onchange = (e) => { const k = e.target.value; if (EX[k]) EX[k](); e.target.value = ''; };
  $('bUndo').onclick = undo; $('bRedo').onclick = redo; $('bDel').onclick = deleteSel; $('bFit').onclick = fitView;
  $('bSvg').onclick = () => download('diagram.svg', exportSVGString(), 'image/svg+xml');
  $('bPng').onclick = exportPNG;
  // simulation controls
  $('bPlay').onclick = playPause;
  $('bStep').onclick = stepOnce;
  $('bReset').onclick = resetSim;
  $('speed').oninput = () => { run.speed = +$('speed').value; $('speedLbl').textContent = run.speed.toFixed(1) + '×'; };
  $('bTests').onclick = runTests;
  $('bTestRun').onclick = runTests;
  $('bTestClose').onclick = () => { $('testBox').hidden = true; };
  window.addEventListener('resize', render);
  view.oy = $('svg').clientHeight - 60;
  let saved = null;
  try { saved = localStorage.getItem('mechSandbox.autosave'); } catch (e) { saved = null; }
  if (saved) { try { scene = fillDefaults(JSON.parse(saved)); } catch (e) { scene = newScene(); } }
  commit();
  updateSimUI();
  requestAnimationFrame((now) => { run.last = now; requestAnimationFrame(frame); });
  setTool('select');
  showPanel();
  if (saved) fitView();
}
window.onMathReady = () => { TEX.ready = true; texReset(); render(); showPanel(); };
init();
if (window.MathJax && MathJax.tex2svg) window.onMathReady();
</script>
